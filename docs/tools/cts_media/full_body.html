<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full-body CTS steps</title>
<style>html,body{margin:0;background:#f7f8fa}canvas{display:block}</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// Render-only: capture.mjs calls setup() once, then render(step, frame) per frame.
const DATA = /*DATA*/null;
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const BG = "#f7f8fa";
const T = {
  n_front: "front", n_three_quarter: "front left",
  holding: "holding", moving: "in motion", settling: "getting into the pose…", L: "L", R: "R",
};
const SIDE_COLOUR = {L: "#2b7de0", R: "#e8862a", C: "#8a929c"};
// The performer faces -Z with their left at -X; yaw 0 puts the camera behind them.
const VIEWS = {
  front: {yaw: Math.PI, pitch: -0.08, name: T.n_front},
  three_quarter: {yaw: Math.PI + 0.85, pitch: -0.12, name: T.n_three_quarter},
};

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// Frames 0..2.15 m: feet on the floor to a hand raised overhead.
const TARGET = [0, 1075, 0];
const DIST = 3600;
function camera(view) {
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const eye = [TARGET[0] + DIST * cp * Math.sin(view.yaw), TARGET[1] - DIST * sp, TARGET[2] + DIST * cp * Math.cos(view.yaw)];
  const f = norm(sub(TARGET, eye));
  const r = norm(cross(f, [0, 1, 0]));
  return {eye, f, r, u: cross(r, f)};
}

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function setup(w, h) {
  const dpr = window.devicePixelRatio || 1;
  W = w; H = h;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return DATA.steps.map(s => ({label: s.label, n: s.frames.length}));
}

function render(si, fi) {
  const s = DATA.steps[si];
  const view = VIEWS[s.view];
  const active = new Set(s.active);
  const n = s.frames.length;
  const frame = s.frames[fi];
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  const cam = camera(view);
  const focal = H * 0.40 * DIST / 1075;
  const P = p => { const d = sub(p, cam.eye); const z = dot(d, cam.f); return [W / 2 + focal * dot(d, cam.r) / z, H / 2 + 4 - focal * dot(d, cam.u) / z, z]; };

  // floor
  ctx.strokeStyle = "#e3e6ea"; ctx.lineWidth = 1;
  for (let x = -1000; x <= 1000; x += 250) line(P([x, 0, -1000]), P([x, 0, 1000]));
  for (let z = -1000; z <= 1000; z += 250) line(P([-1000, 0, z]), P([1000, 0, z]));
  function line(a, b) { if (a[2] <= 0 || b[2] <= 0) return; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }

  const pp = frame.map(P);
  const items = [];
  DATA.parent.forEach((par, j) => {
    if (par < 0) return;
    const hot = active.has(j);
    items.push({z: (pp[j][2] + pp[par][2]) / 2, fn: () => {
      ctx.strokeStyle = SIDE_COLOUR[DATA.side[j]];
      ctx.globalAlpha = active.size && !hot ? 0.55 : 1;
      ctx.lineWidth = focal * (hot ? 70 : 38) / ((pp[j][2] + pp[par][2]) / 2); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(pp[par][0], pp[par][1]); ctx.lineTo(pp[j][0], pp[j][1]); ctx.stroke();
      ctx.globalAlpha = 1;
    }});
  });
  frame.forEach((_, j) => items.push({z: pp[j][2] - 1, fn: () => {
    ctx.fillStyle = SIDE_COLOUR[DATA.side[j]];
    ctx.beginPath(); ctx.arc(pp[j][0], pp[j][1], focal * (j === DATA.head ? 85 : 30) / pp[j][2], 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke();
  }}));
  items.sort((a, b) => b.z - a.z).forEach(it => it.fn());

  // A background halo keeps L / R readable where a limb crosses them.
  ctx.font = `700 12px ${FONT}`; ctx.textAlign = "center";
  ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.strokeStyle = BG;
  DATA.hands.forEach((j, h) => {
    const q = pp[j];
    ctx.strokeText(h ? T.R : T.L, q[0], q[1] - 12);
    ctx.fillStyle = h ? SIDE_COLOUR.R : SIDE_COLOUR.L;
    ctx.fillText(h ? T.R : T.L, q[0], q[1] - 12);
  });

  // Frames after the lead-in span the session's duration at 1/fps each.
  const settling = fi < s.lead;
  const elapsed = (fi - s.lead) / DATA.fps;
  ctx.fillStyle = settling ? "#9aa2ad" : "#1f7a44";
  ctx.font = `600 12px ${FONT}`; ctx.textAlign = "left";
  ctx.fillText(settling ? T.settling : `${s.still ? T.holding : T.moving} ${elapsed.toFixed(1)} / ${s.duration} s`, 12, 20);
  ctx.fillStyle = "#8a929c"; ctx.font = `12px ${FONT}`; ctx.textAlign = "right";
  ctx.fillText(view.name, W - 12, 20);
  ctx.fillStyle = "#e3e6ea"; ctx.fillRect(12, H - 6, W - 24, 3);
  ctx.fillStyle = settling ? "#9aa2ad" : "#1f7a44";
  ctx.fillRect(12, H - 6, (W - 24) * fi / (n - 1), 3);
}
</script>
</body>
</html>
