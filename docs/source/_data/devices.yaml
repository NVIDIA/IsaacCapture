#
# Source of truth for every table on the Ecosystem page; rendered by the
# ``device-matrix`` directive (docs/source/_ext/ecosystem_grid.py).
#
# A row is: name, what it provides, and a Details button opening a panel. Required fields are
# id, name, url, group, and modes; unknown fields fail the build.
#   url      the manufacturer's product page. The name is that link, so no row carries
#            a separate "Overview" link -- and no row needs an `acquire` entry that only
#            repeats it.
#   group    xr | peripheral | data_factory | cloud. ``ecosystem_grid.DEVICE_SECTIONS``
#            maps groups onto tables: xr and peripheral share the input-device table and
#            keep their group header rows, while data_factory and cloud get a table each
#            and render no header row. A group no section claims fails the build.
#   modes    the second column. Its heading is per section: "Input modes" for input
#            devices, where the modes decide the available retargeters and control
#            schemes, and "Provides" for the rest. One short phrase, not a sentence.
#   since    optional; the earliest release carrying the device, rendered under the
#            Details panel's columns as a tag linking to that release -- so a row without
#            `details` cannot have one. A release tag spelled as the repository spells it
#            ("v1.3.131"), or `main` for a device no release carries yet.
#            Derive it, never date it: walk the release tags oldest-first and take the
#            first whose tree carries the device's plugin or guide, as in
#            ``git cat-file -e v1.4.142:src/plugins/oglo_tactile``; `main` when none does.
#            Spell the tag out as shown: zsh reads the `:s` in ``$tag:src/...`` as a
#            history modifier, and the mangled argument answers "present" for every tag.
#            ``ecosystem_grid.SINCE_FLOOR`` is the oldest release this page names, and a
#            device an earlier release carried is listed from the floor instead -- the
#            build rejects anything older, so do not "correct" such a row back to what
#            the walk returned.
#            Ask the tree, not the ancestry -- release branches are maintained by
#            cherry-pick, so a change has a different commit on each branch and
#            ``git tag --contains`` answers "no tag" for every device. Dates mislead too:
#            v1.3.131 (2026-06-30) does not carry the LeRobot integration merged on
#            2026-06-27, which first shipped in v1.4.142.
#   company  optional; the mark of the company behind the device. A mark and nothing
#            else -- no category and no copy, so the table stays the reference it is.
#            `name` and `logo` are both required, `name` being the alt text; add
#            `logo_dark` when a single-color mark would vanish against the other theme,
#            and the two swap with the page. Files live in docs/source/_static/logos/.
#            The mark sits above the Details panel's columns and nowhere else: marks in
#            the row itself were tried before the name, after it, and beside the button,
#            and all three crowded a table whose job is to be scanned.
#   details  optional; the three panel columns, always rendered in the order
#            set up / requirements / acquire. A column with nothing to say renders an em
#            dash so the three stay aligned across devices. Omit `details` entirely and
#            the row gets no button.
#
# A details entry is a bare string, a link, or a way to reach someone:
#   - PICO OS 15.4.4U or newer
#   - label: How To Connect             # plus exactly one of doc, ref, or url
#     ref: connect-quest-pico
#     note: runs in the headset browser # optional gloss, rendered after an em dash
#   - email: sales@example.com          # renders as a mailto: link
#   - phone: +1 (555) 123-4567          # renders as a tel: link
# No sentences and no trailing periods: this is a reference table.
#
# Rows render in file order within their group, so the file reads like the page. There
# is no `order` field to keep in sync.
#
# The docs site and the IsaacTeleop repository are both this project, so a link into
# either is internal and gets no external marker. Only third-party domains do --
# including other GitHub organizations such as isaac-sim.
#
# `planned` renders as one line under the table, not as a row. Its `tracking` url must
# end in an issue or pull number, which the link label picks up: "Tracking #276".
#
# This header and the four section dividers are the only comments the file carries. Why a
# row has no `since`, who cleared a contact, why a plugin is named generically -- none of
# that annotates the row: state it in a field the page renders, put a rule that outlives
# the row up here, and leave the rest to the commit message.

