[project]
name = "agentic-remote-example-tests"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest",
    "numpy",
    "pyyaml",
    # The live view encodes its pictures with cv2; test_view_program.py skips without it.
    "opencv-python-headless",
]
# Only for the tests marked "apai": what an APAI checkout imports. APAI itself is not on PyPI;
# point AGENTIC_REMOTE_APAI_SRC at its src folder.
apai = [
    "opencv-python-headless",
    "jsonschema",
    "pin>=4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "apai: needs an APAI checkout (set AGENTIC_REMOTE_APAI_SRC)",
    "link: needs Isaac Capture's remote link (isaaccapture.remote_link on PYTHONPATH)",
    "experiment: needs the experiment folder (set AGENTIC_REMOTE_EXPERIMENT_DIR)",
    "gpu: needs torch with CUDA on GPU 0; never part of the gate",
    "releases_away_from_rest: a test of the simulated arm that cuts torque off rest",
]
