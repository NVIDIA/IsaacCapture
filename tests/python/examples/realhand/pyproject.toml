[project]
name = "realhand-example-tests"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest", "numpy", "packaging",
    # Mirror the runtime retargeters extra so tests exercise the shipped solver stack.
    "dex-retargeting>=0.4.6,<0.6.0", "six>=1.16",
    "pyyaml>=6.0.3", "scipy>=1.15.0", "torch>=2.7.0",
    "nlopt>=2.6.2", "pin>=4.1",
    "cmeel-urdfdom>=6,<7", "cmeel-tinyxml2>=11,<12",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["../.."]
