name: Setup CloudXR SDK
description: Parse CloudXR versions from .env.default and download the CloudXR Runtime and Web SDKs.

outputs:
  runtime_version:
    description: CloudXR Runtime SDK version from .env.default.
    value: ${{ steps.parse.outputs.runtime_version }}
  web_version:
    description: CloudXR Web SDK version from .env.default.
    value: ${{ steps.parse.outputs.web_version }}

runs:
  using: composite
  steps:
    - name: Parse CloudXR SDK versions from .env.default
      id: parse
      shell: bash
      run: |
        set -euo pipefail

        # Extract CloudXR SDK versions from .env.default.
        CXR_RUNTIME_SDK_VERSION=$(grep -E '^CXR_RUNTIME_SDK_VERSION=.+' deps/cloudxr/.env.default | cut -d= -f2)
        CXR_WEB_SDK_VERSION=$(grep -E '^CXR_WEB_SDK_VERSION=.+' deps/cloudxr/.env.default | cut -d= -f2)

        echo "runtime_version=${CXR_RUNTIME_SDK_VERSION}" >> $GITHUB_OUTPUT
        echo "web_version=${CXR_WEB_SDK_VERSION}" >> $GITHUB_OUTPUT
        echo "CloudXR Runtime SDK version: ${CXR_RUNTIME_SDK_VERSION}"
        echo "CloudXR Web SDK version: ${CXR_WEB_SDK_VERSION}"

    # Both download scripts prefer a tarball already sitting in deps/cloudxr/ over
    # fetching from NGC, so a cache hit makes the download a no-op. NGC 404s
    # transiently and reddens otherwise-good runs; this keeps the pipeline off the
    # network on the common path. Restore only — the save is gated on the downloads
    # succeeding, so a partial fetch is never cached.
    - name: Restore CloudXR SDK tarballs
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          deps/cloudxr/*.tar.gz
          deps/cloudxr/*.tgz
          # The URL each tarball came from, written beside it on download. A
          # cache hit without it leaves every CloudXR wheel member unattributable:
          # an archive explains one only if the repository tracks it or this
          # marker says where it was fetched from.
          deps/cloudxr/*.source
        key: cloudxr-sdk-v2-${{ runner.os }}-${{ runner.arch }}-rt${{ steps.parse.outputs.runtime_version }}-web${{ steps.parse.outputs.web_version }}

    - name: Download CloudXR Runtime SDK
      shell: bash
      env:
        CXR_RUNTIME_SDK_VERSION: ${{ steps.parse.outputs.runtime_version }}
        CXR_DOWNLOAD_EXP: '1'
      run: |
        ./scripts/download_cloudxr_runtime_sdk.sh

    - name: Download CloudXR Web SDK
      shell: bash
      env:
        CXR_WEB_SDK_VERSION: ${{ steps.parse.outputs.web_version }}
      run: |
        ./scripts/download_cloudxr_sdk.sh

    - name: Save CloudXR SDK tarballs
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          deps/cloudxr/*.tar.gz
          deps/cloudxr/*.tgz
          deps/cloudxr/*.source
        key: ${{ steps.cache.outputs.cache-primary-key }}
