name: Test EGO Software

on:
  push:
    branches: [main, 'release/*.*.x']
    paths: &ego_paths
    - '.github/workflows/test-ego-software.yaml'
    - '.github/actions/setup-uv/**'
    - 'CMakeLists.txt'
    - 'pyproject.toml'
    - 'cmake/**'
    - 'deps/**'
    - 'src/CMakeLists.txt'
    - 'src/core/CMakeLists.txt'
    - 'src/plugins/CMakeLists.txt'
    - 'src/plugins/ego/**'
    - 'src/plugins/plugin_utils/**'
    - 'src/core/schema/**'
    - 'src/core/schema_compat/**'
    - 'src/core/codegen/**'
    - 'src/core/mcap/**'
    - 'src/core/deviceio_base/**'
    - 'src/core/deviceio_session/**'
    - 'src/core/deviceio_trackers/**'
    - 'src/core/live_trackers/**'
    - 'src/core/replay_trackers/**'
    - 'src/core/plugin_manager/**'
    - 'src/core/python/**'
    - 'src/core/log_bridge/**'
    - 'src/core/oxr/**'
    - 'src/core/oxr_utils/**'
    - 'src/core/pusherio/**'
    - 'src/core/cloudxr/**'
    - 'src/compat/**'
    - 'src/python/CMakeLists.txt'
    - 'src/python/isaaccapture/**'
    # camera_viz Python EGO tests run in Build Ubuntu with BUILD_VIZ=ON.
    - 'examples/CMakeLists.txt'
    - 'examples/mcap_record_replay/**'
    - 'tests/CMakeLists.txt'
    - 'tests/cpp/CMakeLists.txt'
    - 'tests/cpp/core/CMakeLists.txt'
    - 'tests/cpp/core/schema/**'
    - 'tests/cpp/core/mcap/**'
    - 'tests/cpp/core/live_trackers/**'
    - 'tests/cpp/core/replay_deviceio_session/**'
    - 'tests/cpp/plugins/CMakeLists.txt'
    - 'tests/cpp/plugins/ego*/**'
    - 'tests/python/CMakeLists.txt'
    - 'tests/python/core/CMakeLists.txt'
    - 'tests/python/core/schema/**'
    - 'tests/python/core/ego/**'
    - 'tests/python/examples/mcap_record_replay/**'
    - 'tests/python/repo_paths.py'
  pull_request:
    paths: *ego_paths
  workflow_dispatch:

concurrency:
  group: ego-software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-ego-software:
    # PR execution policy is independent of the runner type.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EGO_BUILD_DIR: ${{ github.workspace }}/build-ego-py3.11
      UV_CACHE_DIR: /tmp/isaaccapture-ego-uv-cache

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install pinned uv
      uses: ./.github/actions/setup-uv

    - name: Install build dependencies and pinned EGO SDK
      shell: bash
      run: |
        set -euo pipefail
        env -u ORBBEC_SDK_ROOT -u PYTHONPATH -u AMENT_PREFIX_PATH -u COLCON_PREFIX_PATH \
          ./src/plugins/ego/install.sh --skip-udev --preset py3.11 --jobs 4

    - name: Configure and build
      shell: bash
      run: |
        set -euo pipefail
        env -u PYTHONPATH -u AMENT_PREFIX_PATH -u COLCON_PREFIX_PATH \
          cmake -S . -B "${EGO_BUILD_DIR}" \
          -DISAAC_TELEOP_PYTHON_VERSION=3.11 \
          -DBUILD_VIZ=OFF \
          -DBUILD_TESTING=ON \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_PYTHON_BINDINGS=ON \
          -DBUILD_PLUGIN_EGO_CAMERA=ON
        cmake --build "${EGO_BUILD_DIR}" --parallel 4

    - name: Run hardware-free EGO tests
      shell: bash
      run: |
        set -euo pipefail
        env -u PYTHONPATH -u AMENT_PREFIX_PATH -u COLCON_PREFIX_PATH \
          ctest --test-dir "${EGO_BUILD_DIR}" --output-on-failure --parallel 4 \
          --no-tests=error -R '[Ee][Gg][Oo]'

    - name: Run full software suite
      shell: bash
      run: |
        set -euo pipefail
        env -u PYTHONPATH -u AMENT_PREFIX_PATH -u COLCON_PREFIX_PATH \
          ctest --test-dir "${EGO_BUILD_DIR}" --output-on-failure --parallel 4

    - name: Upload CTest failure logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: ego-software-ctest-logs
        path: ${{ env.EGO_BUILD_DIR }}/Testing/Temporary
        if-no-files-found: warn
        retention-days: 14
