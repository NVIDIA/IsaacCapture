name: Build Ubuntu

on:
  push:
    branches: [ main, 'release/*.*.x' ]
    tags: [ 'v*' ]
  pull_request:

# For PRs, we want to cancel in-progress runs to save resources.
# For pushes to main or releases, we want to allow all runs to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shared apt build dependencies. Each job installs these plus its own extras
  # (ccache, clang-format, the OAK camera autotools chain).
  CORE_APT_DEPS: build-essential cmake glslang-tools libegl-dev libvulkan-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev patchelf pkg-config wayland-protocols
  # Pin vcpkg to an immutable commit for reproducible, supply-chain-stable CI
  # instead of tracking its moving default branch. Port versions are fixed by the
  # consuming manifest's builtin-baseline (e.g. DepthAI's vcpkg.json), so this
  # commit only needs to be recent enough to contain that baseline. Update the
  # commit and its release-date comment together.
  VCPKG_COMMIT: d015e31e90838a4c9dfa3eed45979bc70d9357fc  # 2026.05.25
  NO_GPU_ARM: "1"

jobs:
  build-ubuntu:
    # Pin to 22.04 so the wheel is built with GCC 11's libstdc++. The resulting wheel
    # then runs on both Ubuntu 22.04 and 24.04 (24.04's libstdc++ is backward compatible).
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        build_type: ["Debug", "Release"]
        python_version: ['3.11', '3.12', '3.13']
        arch: ['x64', 'arm64']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Full history for accurate git describe

    # One build directory per job; later steps (ctest, coverage, test packaging,
    # install) all refer to it through BUILD_DIR.
    - name: Resolve build directory
      run: echo "BUILD_DIR=build" >> "$GITHUB_ENV"

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Install Apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $CORE_APT_DEPS \
          ccache clang-format-14 \
          autoconf automake libtool libudev-dev

    - name: Install coverage tooling
      if: ${{ matrix.build_type == 'Debug' && matrix.python_version == '3.11' && matrix.arch == 'x64' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcovr

    # CUDA toolkit needed at link time for viz_core (device_image
    # links libcudart). The wheel itself excludes libcuda.so.1 via
    # auditwheel; runtime CUDA is the consumer's responsibility.
    # Custom action handles both x86_64 and ARM64 (sbsa) repos.
    - name: Install CUDA toolkit
      uses: ./.github/actions/setup-cuda

    - name: Setup CloudXR SDK
      id: cloudxr-sdk
      uses: ./.github/actions/setup-cloudxr-sdk

    # vcpkg - required when BUILD_PLUGIN_OAK_CAMERA=ON for DepthAI v3.x deps
    - name: Cache vcpkg
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/vcpkg
          ${{ env.BUILD_DIR }}/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/DepthAIVcpkgManifest.cmake') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-

    - name: Setup vcpkg
      run: |
        if [ ! -f ~/vcpkg/vcpkg ]; then
          git clone https://github.com/microsoft/vcpkg ~/vcpkg
          git -C ~/vcpkg checkout --detach "$VCPKG_COMMIT"
          ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-py${{ matrix.python_version }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-py${{ matrix.python_version }}-

    - name: Verify ccache
      run: |
        ccache --version
        ccache --show-config

    # depthai-core downloads the device/bootloader *.fwp blobs into its build
    # tree at configure time, once per matrix entry; artifacts.luxonis.com fails
    # often enough to redden unrelated PRs. Its DownloadAndChecksum skips any
    # file already on disk, so a restored resources/ makes the fetch a no-op.
    # Keyed on the DEPTHAI_COMMIT pin, which selects the firmware version.
    # Split restore/save on purpose: the combined action also saves on a failed
    # job, and CMake's file(DOWNLOAD) leaves a truncated file behind on error —
    # that would be cached and then pass the "already downloaded" check forever.
    - name: Restore DepthAI device resources
      id: depthai-resources
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ env.BUILD_DIR }}/_deps/depthai-build/resources
        key: depthai-resources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/DepthAIVcpkgManifest.cmake') }}

    - name: Configure CMake
      run: |
        coverage_args=()
        if [[ "${{ matrix.build_type }}" == "Debug" && "${{ matrix.python_version }}" == "3.11" && "${{ matrix.arch }}" == "x64" ]]; then
          coverage_args=(
            -DCMAKE_C_FLAGS="--coverage -O0 -g"
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
            -DCMAKE_MODULE_LINKER_FLAGS="--coverage"
          )
        fi

        cmake -B "${BUILD_DIR}" \
          -DISAAC_TELEOP_PYTHON_VERSION=${{ matrix.python_version }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBUILD_PLUGIN_OAK_CAMERA=ON \
          -DBUILD_VIZ=ON \
          -DENABLE_CLOUDXR_BUNDLE_CHECK=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          "${coverage_args[@]}"

    # Configure succeeded, so every *.fwp downloaded and checksummed cleanly.
    - name: Save DepthAI device resources
      if: steps.depthai-resources.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ env.BUILD_DIR }}/_deps/depthai-build/resources
        key: ${{ steps.depthai-resources.outputs.cache-primary-key }}

    - name: Build
      run: cmake --build "${BUILD_DIR}" --parallel 4

    - name: ccache stats
      run: ccache --show-stats

    - name: Run All Tests
      run: ctest --test-dir "${BUILD_DIR}" --output-on-failure --parallel

    - name: Generate coverage report
      if: ${{ matrix.build_type == 'Debug' && matrix.python_version == '3.11' && matrix.arch == 'x64' }}
      run: |
        set -euo pipefail
        mkdir -p coverage/html

        gcovr_args=(
          --root "${GITHUB_WORKSPACE}"
          --object-directory "${BUILD_DIR}/src"
          # CMake compiler-id probes are not test targets and produce noisy gcov warnings.
          --gcov-exclude "${BUILD_DIR}/CMakeFiles/.*/CompilerId.*/.*"
          --exclude-directories "${BUILD_DIR}/CMakeFiles"
          --filter "src/"
          --exclude "tests/.*"
        )

        gcovr "${gcovr_args[@]}" --txt --output coverage/summary.txt --print-summary | tee coverage/totals.txt
        gcovr "${gcovr_args[@]}" --xml-pretty --output coverage/cobertura.xml
        gcovr "${gcovr_args[@]}" --html-details --output coverage/html/index.html

    - name: Publish coverage summary
      if: ${{ matrix.build_type == 'Debug' && matrix.python_version == '3.11' && matrix.arch == 'x64' }}
      run: |
        set -euo pipefail
        {
          echo "## CTest coverage"
          echo
          echo "Native coverage was generated from the existing Ubuntu Debug x64 Python 3.11 CTest matrix entry."
          echo
          echo "### Totals"
          echo '```'
          cat coverage/totals.txt
          echo '```'
          echo
          echo "Download the \`isaacteleop-coverage-ubuntu-debug\` artifact for the HTML report and \`coverage/cobertura.xml\`."
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload coverage artifact
      if: ${{ matrix.build_type == 'Debug' && matrix.python_version == '3.11' && matrix.arch == 'x64' }}
      uses: actions/upload-artifact@v6
      with:
        name: isaacteleop-coverage-ubuntu-debug
        path: |
          coverage/summary.txt
          coverage/totals.txt
          coverage/cobertura.xml
          coverage/html
        if-no-files-found: error
        retention-days: 14

    - name: Package viz test binaries (Release, py3.11 only)
      # GPU [gpu]-tagged tests run separately on a self-hosted GPU runner
      # in the test-viz-gpu job. We package the test executables here so
      # that job can download and run them without rebuilding. Test binaries
      # don't depend on Python, so we only upload from one matrix entry.
      if: ${{ matrix.build_type == 'Release' && matrix.python_version == '3.11' }}
      run: |
        set -euo pipefail
        mkdir -p viz-tests-pkg
        # Glob all viz_*_tests executables (covers viz_core_tests today, and
        # viz_layers_tests / viz_session_tests / viz_xr_tests as they ship).
        find "${BUILD_DIR}/tests/cpp/viz" -name 'viz_*_tests' -type f -executable \
          -exec cp -v {} viz-tests-pkg/ \;
        if ! ls viz-tests-pkg/viz_*_tests >/dev/null 2>&1; then
          echo "No viz test binaries found under ${BUILD_DIR}/tests/cpp/viz/"
          exit 1
        fi
        tar -cvzf viz-tests.tar.gz -C viz-tests-pkg .

    - name: Upload viz test binaries (Release, py3.11 only)
      if: ${{ matrix.build_type == 'Release' && matrix.python_version == '3.11' }}
      uses: actions/upload-artifact@v6
      with:
        name: viz-tests-${{ matrix.arch }}
        path: viz-tests.tar.gz
        if-no-files-found: error
        retention-days: 7

    - name: Install (Release only)
      if: matrix.build_type == 'Release'
      run: cmake --install "${BUILD_DIR}"

    - name: Repair wheel tags with auditwheel (Release only)
      if: matrix.build_type == 'Release'
      run: |
        set -euo pipefail

        shopt -s nullglob
        wheels=(install/wheels/*.whl)
        if (( ${#wheels[@]} == 0 )); then
          echo "No wheels found under install/wheels/*.whl"
          ls -la install/wheels || true
          exit 1
        fi

        mkdir -p install/wheels-repaired
        for wheel in "${wheels[@]}"; do
          echo "Repairing ${wheel}"
          # Exclude GPU driver/runtime libs so wheels stay portable across systems without bundling host-specific binaries.
          # Allow the metadata-only isaacteleop transition wheel through unchanged.
          uv run --python ${{ matrix.python_version }} --with "auditwheel==6.6.0" \
            auditwheel repair --allow-pure-python-wheel --exclude libcuda.so.1 --exclude libvulkan.so.1 --wheel-dir install/wheels-repaired "${wheel}"
        done

        rm -f install/wheels/*.whl
        mv install/wheels-repaired/*.whl install/wheels/
        rmdir install/wheels-repaired || true

    - name: Create tarball to preserve permissions
      if: matrix.build_type == 'Release'
      run: tar -cvf isaacteleop-install.tar -C install .

    - name: Upload Release artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: isaacteleop-install-release-${{ matrix.arch }}-py${{ matrix.python_version }}
        path: isaacteleop-install.tar
        retention-days: 7
    - name: Upload wheel artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: isaacteleop-wheels-${{ matrix.arch }}-py${{ matrix.python_version }}
        path: install/wheels/*.whl
        if-no-files-found: error
        retention-days: 7

  pip-editable-install:
    # Validates the scikit-build-core (PEP 517/660) from-source install path added
    # for issue #735: an sdist build and `pip install -e .` over the root
    # pyproject.toml, which drives the same top-level CMake build as build-ubuntu.
    # This guards the standards-based path so it does not rot. Single config
    # (x64 / Python 3.11 / Release) is sufficient -- the backend just wraps CMake,
    # already matrix-tested above. No CUDA/Vulkan here, so BUILD_VIZ stays auto-OFF.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Install Apt dependencies
      run: |
        sudo apt-get update
        # clang-format-14: the pip build enforces the clang-format gate (no
        # cmake.define override), so the tool must be present or the build FATALs.
        sudo apt-get install -y $CORE_APT_DEPS ccache clang-format-14

    - name: Build sdist (validates backend config + metadata)
      run: |
        set -euo pipefail
        uv build --sdist --python 3.11 --out-dir dist
        ls -la dist

    - name: Editable install
      run: |
        set -euo pipefail
        uv venv --python 3.11 .venv-skbuild
        # Editable install through scikit-build-core. It drives the same CMake
        # build, scoped by pyproject.toml (no examples/tests/plugins/clang-format),
        # and fetches C++ deps via FetchContent.
        uv pip install --python .venv-skbuild -e .

    - name: Import smoke test
      run: |
        set -euo pipefail
        cat > "${RUNNER_TEMP}/skbuild_smoke.py" <<'PY'
        import importlib.util

        # (1) ABI check: actually import the compiled pybind11 extensions and the
        # eager pure-Python packages. `import isaaccapture` also exercises the eager
        # submodule chain (cloudxr, teleop_session_manager) that the base install
        # must satisfy with only numpy+pyyaml.
        import isaaccapture
        for mod in (
            "oxr",
            "deviceio",
            "deviceio_trackers",
            "deviceio_session",
            "schema",
            "plugin_manager",
        ):
            importlib.import_module(f"isaaccapture.{mod}")

        # (2) Completeness check: every top-level subpackage that the classic wheel
        # ships (minus GPU-only `viz`, which is auto-OFF here) must be PACKAGED.
        # find_spec locates the package without importing its optional third-party
        # deps, so a subpackage silently dropped from the build fails loudly here
        # even though the smoke env installs no extras.
        expected = [
            "isaaccapture.mcap",
            "isaaccapture.cloudxr",
            "isaaccapture.teleop_session_manager",
            "isaaccapture.retargeters",
            "isaaccapture.retargeting_engine",
            "isaaccapture.retargeting_engine_ui",
            "isaaccapture.haptic_devices",
        ]
        missing = [m for m in expected if importlib.util.find_spec(m) is None]
        assert not missing, f"subpackages missing from the wheel: {missing}"

        # (3) The editable redirect serves the old name. Only check of the
        # `isaacteleop.py` entry in wheel.packages; ctest reads the staged tree,
        # which resolves through the normal PathFinder instead.
        import isaacteleop
        assert isaacteleop is isaaccapture, "the alias did not resolve to isaaccapture"

        print("isaaccapture", isaaccapture.__version__, "imported OK;",
              "all expected subpackages present; isaacteleop alias resolves")
        PY
        # Run the editable install directly with the venv's interpreter -- NOT via
        # `uv run`, which (with [tool.uv] package = false) would use the project's
        # own .venv without isaaccapture, rather than .venv-skbuild.
        .venv-skbuild/bin/python "${RUNNER_TEMP}/skbuild_smoke.py"

    - name: Wheel contents (the pip wheel ships both names)
      run: |
        set -euo pipefail
        # ctest's packaging suite reads the classic uv-built wheels; this is the
        # only thing that reaches a wheel built by the pip config, which has its
        # own wheel.packages mapping.
        uv build --wheel --python 3.11 --out-dir dist-wheel src/compat
        uv build --wheel --python 3.11 --out-dir dist-wheel
        ISAAC_TELEOP_WHEELS_DIR="${PWD}/dist-wheel" \
          uv run --python 3.11 --directory tests/python/packaging --extra dev \
          pytest -v test_wheel_contents.py

  # Jobs `if:` conditions cannot see the `matrix` context, so arm64 GPU test
  # runs are skipped by computing the test matrix here instead: when
  # NO_GPU_ARM=1, arm64 drops out of the matrix entirely (no self-hosted arm64
  # GPU runner is claimed) while build-ubuntu still builds arm64 unconditionally.
  resolve-test-arches:
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      arches: ${{ steps.resolve.outputs.arches }}
    steps:
    - name: Resolve GPU test architectures
      id: resolve
      run: |
        if [[ "$NO_GPU_ARM" == "1" ]]; then
          echo 'arches=["x64"]' >> "$GITHUB_OUTPUT"
        else
          echo 'arches=["x64", "arm64"]' >> "$GITHUB_OUTPUT"
        fi

  test-viz-gpu:
    # Runs [gpu]-tagged Catch2 tests for the Televiz module on a self-hosted
    # GPU runner. The build-ubuntu job runs on a GPU-less GitHub-hosted runner
    # where these tests SKIP cleanly; this job actually exercises the Vulkan
    # / CUDA paths that build-ubuntu cannot.
    runs-on: [self-hosted, linux, gpu, "${{ matrix.arch }}"]
    needs: [build-ubuntu, resolve-test-arches]

    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        arch: ${{ fromJson(needs.resolve-test-arches.outputs.arches) }}

    steps:
    - name: Download viz test binaries
      uses: actions/download-artifact@v7
      with:
        name: viz-tests-${{ matrix.arch }}

    - name: Extract test binaries
      run: |
        set -euo pipefail
        mkdir -p viz-tests
        tar -xzvf viz-tests.tar.gz -C viz-tests
        chmod +x viz-tests/viz_*_tests

    # No CUDA Toolkit install on the GPU runner — viz_core static-links
    # libcudart_static, so the binaries only need the NVIDIA driver
    # (libcuda.so.1) which the runner already has.

    - name: Run viz [gpu] tests
      run: |
        set -euo pipefail
        cd viz-tests
        # Run [gpu]-tagged tests for every viz_*_tests binary. The build-ubuntu
        # job already covered [unit] tests on a CPU-only runner; here we focus
        # on the GPU paths that genuinely need Vulkan/CUDA at runtime.
        #
        # --allow-running-no-tests makes "no [gpu] tests in this binary" a
        # success rather than a Catch2 exit-code-2 failure. Some binaries
        # (e.g. viz_layers_tests today) only have [unit] tests; that's
        # expected, not a regression.
        #
        # We retry once on failure: the self-hosted GPU runner is shared with
        # test-cloudxr / test-teleop-ros2, and concurrent Vulkan/CUDA usage
        # can transiently make vkEnumeratePhysicalDevices return no suitable
        # devices. A single retry after a short sleep clears these flakes
        # without masking real regressions (a true bug would fail twice).
        run_one() {
          local bin=$1
          if ./"${bin}" "[gpu]" --reporter compact --allow-running-no-tests; then
            return 0
          fi
          echo "::warning::${bin} [gpu] failed on first attempt; retrying after 5s"
          sleep 5
          ./"${bin}" "[gpu]" --reporter compact --allow-running-no-tests
        }
        failures=0
        for test_bin in viz_*_tests; do
          echo "================================================================"
          echo "Running ${test_bin} [gpu]"
          echo "================================================================"
          if ! run_one "${test_bin}"; then
            failures=$((failures + 1))
          fi
        done
        if [ "${failures}" -ne 0 ]; then
          echo "${failures} viz GPU test binary/binaries reported failures"
          exit 1
        fi

    # ── viz_python GPU tests ─────────────────────────────────────────
    # build-ubuntu runs the headless Python tests (import smoke, protocol
    # dict shape, numpy round-trip). The remaining viz_python suite —
    # test_offscreen_session.py and the CuPy round-trips in
    # test_array_interface.py — needs a real Vulkan / CUDA device, so we
    # exercise it here against the wheel we just built.
    #
    # Pinned to one Python version (3.12). The bindings layer is thin;
    # cross-Python coverage is already provided by the build-ubuntu
    # matrix (which runs every viz_python test that doesn't need a GPU).

    - name: Checkout source (for pyproject.toml + viz python tests)
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Download isaaccapture wheel (py3.12)
      uses: actions/download-artifact@v7
      with:
        name: isaacteleop-wheels-${{ matrix.arch }}-py3.12
        path: viz-python-wheels

    - name: Run viz_python tests against the GPU
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(viz-python-wheels/isaaccapture-*.whl)
        if (( ${#wheels[@]} == 0 )); then
          echo "No isaaccapture wheel found"
          ls -la viz-python-wheels || true
          exit 1
        fi
        # Same retry treatment as the C++ [gpu] tests above — the
        # self-hosted runner is shared with other GPU jobs and Vulkan
        # device enumeration occasionally returns empty under contention.
        run_pytest() {
          uv run --python 3.12 \
                 --find-links viz-python-wheels \
                 --with "${wheels[0]}" \
                 --with pytest \
                 --with numpy \
                 --with cupy-cuda12x \
                 pytest -v --tb=short tests/python/viz/
        }
        if ! run_pytest; then
          echo "::warning::viz_python GPU tests failed on first attempt; retrying after 5s"
          sleep 5
          run_pytest
        fi

  test-viz-sanitizers:
    # Builds the viz module with AddressSanitizer + UndefinedBehaviorSanitizer
    # and runs only the [unit]-tagged Catch2 tests on a GPU-less GitHub-hosted
    # runner. Catches lifetime / leak / UB bugs that pass the regular build
    # (validate-then-allocate failures, missed deletes, dangling refs).
    #
    # [gpu] tests are intentionally NOT run here: ASAN intercepts mmap /
    # malloc and clashes with the NVIDIA Vulkan driver's own allocators
    # in ways that produce false positives. The GPU surface is covered
    # by test-viz-gpu on the self-hosted runner.
    runs-on: ubuntu-22.04
    needs: build-ubuntu

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Install Apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $CORE_APT_DEPS \
          ccache clang-format-14

    - name: Install CUDA toolkit
      uses: ./.github/actions/setup-cuda

    - name: Cache ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-sanitizers-

    - name: Configure CMake (ASAN + UBSAN)
      run: |
        cmake -B build-san \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_VIZ=ON \
          -DBUILD_PLUGINS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DENABLE_CLOUDXR_BUNDLE_CHECK=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build viz tests
      run: |
        cmake --build build-san --parallel 4 \
          --target viz_core_tests viz_layers_tests viz_session_tests

    - name: Run viz [unit] tests under sanitizers
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        set -euo pipefail
        ctest --test-dir build-san -L unit --output-on-failure

  test-cloudxr:
    runs-on: [self-hosted, linux, gpu, "${{ matrix.arch }}"]
    needs: [build-ubuntu, resolve-test-arches]

    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        python_version: ['3.11', '3.12', '3.13']
        arch: ${{ fromJson(needs.resolve-test-arches.outputs.arches) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Download install artifacts
      uses: actions/download-artifact@v7
      with:
        name: isaacteleop-install-release-${{ matrix.arch }}-py${{ matrix.python_version }}

    - name: Extract tarball to preserve permissions
      run: |
        mkdir -p install
        tar -xvf isaacteleop-install.tar -C install

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Run Tests with CloudXR
      env:
        CI: true
        ACCEPT_CLOUDXR_EULA: Y
      run: |
        # Create .env file with EULA acceptance
        echo "ACCEPT_CLOUDXR_EULA=Y" > deps/cloudxr/.env

        # Run tests with CloudXR runtime
        ./scripts/run_tests_with_cloudxr.sh --python-version ${{ matrix.python_version }}

  test-teleop-ros2:
    runs-on: [self-hosted, linux, gpu, "${{ matrix.arch }}"]
    needs: [build-ubuntu, resolve-test-arches]

    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        python_version: ['3.12']
        arch: ${{ fromJson(needs.resolve-test-arches.outputs.arches) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install uv
      uses: ./.github/actions/setup-uv

    - name: Download install artifacts
      uses: actions/download-artifact@v7
      with:
        name: isaacteleop-install-release-${{ matrix.arch }}-py${{ matrix.python_version }}

    - name: Extract tarball to preserve permissions
      run: |
        mkdir -p install
        tar -xvf isaacteleop-install.tar -C install

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Each ROS distro is tied to its own system Python, so the distro follows
    # from the matrix entry: Jazzy is 3.12. Humble would be 3.10, which is below
    # the supported floor.
    - name: Set ROS Distro
      id: ros-distro
      run: |
        if [ "${{ matrix.python_version }}" = "3.12" ]; then
          echo "ROS_DISTRO=jazzy" >> $GITHUB_ENV
        else
          echo "::error::No ROS distro mapped to Python ${{ matrix.python_version }}"
          exit 1
        fi

    - name: Setup CloudXR SDK
      uses: ./.github/actions/setup-cloudxr-sdk

    - name: Build teleop_ros2 image
      run: |
        docker build -f examples/teleop_ros2/Dockerfile \
          --build-arg ROS_DISTRO=${{ env.ROS_DISTRO }} \
          --build-arg PYTHON_VERSION=${{ matrix.python_version }} \
          -t teleop_ros2_ref:${{ env.ROS_DISTRO }} .

    - name: Run teleop_ros2 Python unit tests
      run: |
        set -euo pipefail
        TEST_IMAGE="teleop_ros2_ref-tests:${{ env.ROS_DISTRO }}"
        trap 'docker image rm -f "$TEST_IMAGE" >/dev/null 2>&1 || true' EXIT

        docker build -f examples/teleop_ros2/Dockerfile \
          --target test \
          --build-arg ROS_DISTRO=${{ env.ROS_DISTRO }} \
          --build-arg PYTHON_VERSION=${{ matrix.python_version }} \
          -t "$TEST_IMAGE" .

        docker run --rm \
          -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
          --entrypoint bash "$TEST_IMAGE" -c \
          "source /usr/local/bin/teleop-env-setup && \
           exec uv run --with pytest --no-sync pytest -v --tb=short tests"

    # MCAP replay path: feed a recorded fixture through the node
    # (SessionMode.REPLAY, no CloudXR runtime / GPU) across all teleop modes and
    # verify the published topics. The cheaper, deterministic check; runs before
    # the live bring-up below, which reuses the same image and removes it on
    # teardown.
    - name: Verify application modes (MCAP replay)
      run: |
        set -euo pipefail

        PROJECT_NAME="isaacteleop-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}-${{ env.ROS_DISTRO }}"
        LOG_FILE_BASE="/tmp/ros2_test_output_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ matrix.arch }}_${{ env.ROS_DISTRO }}"
        REPLAY_MCAP="/tmp/teleop_ros2_test_input_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ matrix.arch }}_${{ env.ROS_DISTRO }}.mcap"
        STARTUP_MARKER="TeleopSession started successfully"
        READINESS_TIMEOUT_SEC=30
        READINESS_POLL_INTERVAL_SEC=1

        # Cleanup
        trap 'docker ps -aq --filter "name=teleop-ros2-$PROJECT_NAME" | xargs -r docker rm -f >/dev/null 2>&1 || true; rm -f "$REPLAY_MCAP"' EXIT

        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v /tmp:/tmp \
          --entrypoint bash teleop_ros2_ref:${{ env.ROS_DISTRO }} -c \
          "source /usr/local/bin/teleop-env-setup && exec /opt/isaaccapture/install/examples/teleop_ros2/cpp/integration_tests/teleop_ros2_mcap_generator '$REPLAY_MCAP'"

        scenarios=(
          "controller_teleop mode_default native"
          "hand_teleop mode_default native"
          "controller_raw mode_default native"
          "full_body mode_default native"
          "controller_teleop pink_ik native"
          "controller_teleop wuji native"
          "hand_teleop wuji native"
          "controller_teleop dexpilot manus"
          "controller_teleop dexpilot wuji"
        )
        for scenario in "${scenarios[@]}"; do
          read -r mode hand_retargeter hand_tracking_provider <<< "$scenario"
          scenario_name="${mode}_${hand_retargeter}_${hand_tracking_provider}"
          echo "Testing mode: $mode (hand_retargeter=$hand_retargeter, hand_tracking_provider=$hand_tracking_provider)"
          LOG_FILE="${LOG_FILE_BASE}_${scenario_name}.log"
          RUN_NAME="teleop-ros2-${PROJECT_NAME}-${scenario_name//_/-}"
          verifier_rc=0
          docker_rc=0
          started=false

          rm -f "$LOG_FILE"

          docker run -d \
            --name "$RUN_NAME" \
            --network host \
            -v /tmp:/tmp \
            -e PYTHONUNBUFFERED=1 \
            --entrypoint bash teleop_ros2_ref:${{ env.ROS_DISTRO }} -c \
            "source /usr/local/bin/teleop-env-setup && exec uv run --no-sync teleop_ros2_node.py --ros-args -p mode:=$mode -p hand_retargeter:=$hand_retargeter -p hand_tracking_provider:=$hand_tracking_provider -p mcap_replay_path:=$REPLAY_MCAP" >/dev/null

          deadline=$((SECONDS + READINESS_TIMEOUT_SEC))
          while [ "$SECONDS" -lt "$deadline" ]; do
            docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true

            if [ -f "$LOG_FILE" ] && grep -q "$STARTUP_MARKER" "$LOG_FILE"; then
              started=true
              break
            fi

            running=$(docker inspect -f '{{.State.Running}}' "$RUN_NAME" 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              docker_rc=$(docker inspect -f '{{.State.ExitCode}}' "$RUN_NAME" 2>/dev/null || echo 1)
              break
            fi

            sleep "$READINESS_POLL_INTERVAL_SEC"
          done

          docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true

          if [ "$started" = true ]; then
            if docker exec \
              -e PYTHONUNBUFFERED=1 \
              "$RUN_NAME" bash -c \
              "source /usr/local/bin/teleop-env-setup && exec uv run --no-sync python -m integration_tests.teleop_ros2_topic_verifier --mode $mode --hand-retargeter $hand_retargeter --hand-tracking-provider $hand_tracking_provider"; then
              verifier_rc=0
            else
              verifier_rc=$?
            fi
            docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true
            docker stop --time 5 "$RUN_NAME" >/dev/null || true
            docker wait "$RUN_NAME" >/dev/null || true
          else
            running=$(docker inspect -f '{{.State.Running}}' "$RUN_NAME" 2>/dev/null || echo false)
            if [ "$running" = "true" ]; then
              echo "Error: TeleopSession did not report readiness within ${READINESS_TIMEOUT_SEC}s for $scenario_name"
              docker stop --time 5 "$RUN_NAME" >/dev/null || true
              docker wait "$RUN_NAME" >/dev/null || true
            else
              echo "Error: teleop_ros2_node exited before readiness for $scenario_name (exit code $docker_rc)"
            fi
          fi

          docker rm -f "$RUN_NAME" >/dev/null 2>&1 || true

          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "No test log captured at $LOG_FILE"
          fi

          if [ "$started" != true ]; then
            exit 1
          fi
          if [ "$verifier_rc" -ne 0 ]; then
            echo "Error: topic verifier failed for $scenario_name (exit code $verifier_rc)"
            exit "$verifier_rc"
          fi
        done

    # Live CloudXR and managed-plugin bring-up on the same GPU runner, reusing
    # the teleop_ros2_ref image built above. Runs the teleop_ros2 node against a
    # real in-process CloudXR runtime and requires the bundled Wuji plugin to
    # start through TeleopSession. No XR client or glove is required.
    - name: Verify live CloudXR bring-up
      run: |
        set -euo pipefail

        IMAGE="teleop_ros2_ref:${{ env.ROS_DISTRO }}"
        RUN_NAME="teleop-ros2-cloudxr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}-${{ env.ROS_DISTRO }}"
        LOG_FILE="/tmp/ros2_cloudxr_output_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${{ matrix.arch }}_${{ env.ROS_DISTRO }}.log"
        MODE="controller_teleop"
        HAND_RETARGETER="dexpilot"
        HAND_TRACKING_PROVIDER="wuji"

        # The node logs this after CloudXRLauncher returns: runtime ready + WSS
        # proxy up. This is the primary bring-up marker.
        BRINGUP_MARKER="CloudXR runtime and WSS proxy started"
        SESSION_MARKER="TeleopSession started successfully"
        PLUGIN_MARKER_RE="wuji_glove\.WujiGlovePlugin\].*initialized and running"
        # Hard failures from the launcher, runtime, or plugin lifecycle.
        FAIL_RE="CloudXR runtime failed to start|SDK missing libcloudxr.so|CloudXR EULA was not accepted|CloudXR launcher is not running|runtime process exited unexpectedly|WSS proxy thread stopped unexpectedly|Plugin process exited immediately|Required plugin .* was not discovered"

        BRINGUP_TIMEOUT_SEC=180
        LOOP_TIMEOUT_SEC=30
        SOAK_SEC=15
        POLL_INTERVAL_SEC=2

        rm -f "$LOG_FILE"

        cleanup() {
          docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true
          docker rm -f "$RUN_NAME" >/dev/null 2>&1 || true
          docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        # Live session: no mcap_replay_path => SessionMode.LIVE; accept the EULA
        # non-interactively. --gpus all gives the in-process runtime a GPU.
        docker run -d \
          --name "$RUN_NAME" \
          --gpus all \
          -e PYTHONUNBUFFERED=1 \
          -e ACCEPT_CLOUDXR_EULA=Y \
          --entrypoint bash "$IMAGE" -c \
          "source /usr/local/bin/teleop-env-setup && exec uv run --no-sync teleop_ros2_node.py --ros-args -p mode:=$MODE -p hand_retargeter:=$HAND_RETARGETER -p hand_tracking_provider:=$HAND_TRACKING_PROVIDER -p cloudxr_accept_eula:=true" >/dev/null

        fail() {
          echo "Error: $1"
          docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true
          echo "===== teleop_ros2 (live) container log ====="
          cat "$LOG_FILE" 2>/dev/null || echo "No log captured"
          exit 1
        }

        # Phase 1: wait for CloudXR runtime + WSS proxy bring-up.
        bringup=false
        deadline=$((SECONDS + BRINGUP_TIMEOUT_SEC))
        while [ "$SECONDS" -lt "$deadline" ]; do
          docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true

          if grep -Eq "$FAIL_RE" "$LOG_FILE"; then
            fail "live bring-up reported a fatal error"
          fi
          if grep -qF "$BRINGUP_MARKER" "$LOG_FILE"; then
            bringup=true
            break
          fi

          running=$(docker inspect -f '{{.State.Running}}' "$RUN_NAME" 2>/dev/null || echo false)
          if [ "$running" != "true" ]; then
            rc=$(docker inspect -f '{{.State.ExitCode}}' "$RUN_NAME" 2>/dev/null || echo 1)
            fail "node exited before CloudXR bring-up (exit code $rc)"
          fi

          sleep "$POLL_INTERVAL_SEC"
        done

        if [ "$bringup" != true ]; then
          fail "CloudXR runtime + WSS proxy did not come up within ${BRINGUP_TIMEOUT_SEC}s"
        fi
        echo "CloudXR runtime + WSS proxy came up."

        # Phase 2: require both the live session and managed Wuji plugin.
        ready=false
        deadline=$((SECONDS + LOOP_TIMEOUT_SEC))
        while [ "$SECONDS" -lt "$deadline" ]; do
          docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true
          if grep -Eq "$FAIL_RE" "$LOG_FILE"; then
            fail "live bring-up reported a fatal error after CloudXR startup"
          fi
          if grep -qF "$SESSION_MARKER" "$LOG_FILE" && grep -Eq "$PLUGIN_MARKER_RE" "$LOG_FILE"; then
            ready=true
            break
          fi
          running=$(docker inspect -f '{{.State.Running}}' "$RUN_NAME" 2>/dev/null || echo false)
          if [ "$running" != "true" ]; then
            rc=$(docker inspect -f '{{.State.ExitCode}}' "$RUN_NAME" 2>/dev/null || echo 1)
            fail "node exited before the live session and Wuji plugin started (exit code $rc)"
          fi
          sleep "$POLL_INTERVAL_SEC"
        done

        if [ "$ready" != true ]; then
          fail "live session and Wuji plugin did not start within ${LOOP_TIMEOUT_SEC}s"
        fi
        if ! docker exec "$RUN_NAME" pgrep -f '(^|/)wuji_glove_plugin( |$)' >/dev/null; then
          fail "Wuji plugin process is not running after startup"
        fi
        echo "Live session and managed Wuji plugin started."

        # Phase 3: soak. The node calls launcher.health_check() every loop, so a
        # dead runtime/WSS proxy would crash it. Surviving the soak with no fatal
        # log means the live CloudXR stack stayed healthy.
        sleep "$SOAK_SEC"
        docker logs "$RUN_NAME" > "$LOG_FILE" 2>&1 || true
        if grep -Eq "$FAIL_RE" "$LOG_FILE"; then
          fail "live bring-up reported a fatal error during soak"
        fi
        running=$(docker inspect -f '{{.State.Running}}' "$RUN_NAME" 2>/dev/null || echo false)
        if [ "$running" != "true" ]; then
          rc=$(docker inspect -f '{{.State.ExitCode}}' "$RUN_NAME" 2>/dev/null || echo 1)
          fail "node exited during the ${SOAK_SEC}s soak (exit code $rc)"
        fi
        if ! docker exec "$RUN_NAME" pgrep -f '(^|/)wuji_glove_plugin( |$)' >/dev/null; then
          fail "Wuji plugin process exited during the ${SOAK_SEC}s soak"
        fi

        docker stop --time 5 "$RUN_NAME" >/dev/null || true
        echo "===== teleop_ros2 (live) container log ====="
        cat "$LOG_FILE" 2>/dev/null || echo "No log captured"
        echo "Live CloudXR and Wuji plugin bring-up verified for mode $MODE (${{ env.ROS_DISTRO }}, ${{ matrix.arch }})."

  # These are the actual dependency jobs for publish-wheel. publish-wheel
  # depends only on wheel-gate so the dependency list lives in one place, while
  # this gate still runs for fork PRs where publish-wheel is intentionally skipped.
  wheel-gate:
    runs-on: ubuntu-22.04
    permissions: {}
    needs:
      - build-ubuntu
      - test-viz-gpu
      - test-viz-sanitizers
      - test-cloudxr
      - test-teleop-ros2
    if: ${{ always() }}

    steps:
    - name: Require wheel dependencies success
      env:
        NEEDS_JSON: ${{ toJson(needs) }}
      run: |
        set -euo pipefail

        failed_jobs="$(
          jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key) completed with result: \(.value.result)"
          ' <<< "${NEEDS_JSON}"
        )"

        if [[ -n "${failed_jobs}" ]]; then
          echo "${failed_jobs}"
          exit 1
        fi

        echo "All wheel dependency jobs completed successfully"

  publish-wheel:  # to internal Artifactory
    runs-on: [self-hosted, linux]
    permissions: {}
    needs:
      - wheel-gate
    outputs:
      wheel_paths: ${{ steps.upload-artifactory.outputs.wheel_paths }}
    environment: dev
    timeout-minutes: 10

    # Publish only for same-repo runs (pushes or non-fork PRs). github.repository
    # is the base repo even for fork PRs, so compare the PR head repo instead.
    if: >-
      needs.wheel-gate.result == 'success'
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Ensure clean wheels directory
      run: |
        rm -rf wheels

    - name: Download wheel artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: isaacteleop-wheels-*
        merge-multiple: true
        path: wheels

    - name: Upload wheel(s) to Artifactory
      id: upload-artifactory
      env:
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        ARTIFACTORY_REPO: ${{ secrets.ARTIFACTORY_REPO }}
        ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
      run: |
        set -euo pipefail

        if [[ -z "${ARTIFACTORY_URL}" || -z "${ARTIFACTORY_REPO}" || -z "${ARTIFACTORY_USERNAME}" || -z "${ARTIFACTORY_API_KEY}" ]]; then
          echo "Missing one or more required secrets: ARTIFACTORY_URL, ARTIFACTORY_REPO, ARTIFACTORY_USERNAME, ARTIFACTORY_API_KEY"
          exit 1
        fi

        if [[ "${ARTIFACTORY_URL}" != https://* ]]; then
          echo "ARTIFACTORY_URL must use https://"
          exit 1
        fi

        shopt -s nullglob
        wheels=(wheels/*.whl)
        if (( ${#wheels[@]} == 0 )); then
          echo "No wheels found under wheels/*.whl"
          ls -la wheels || true
          exit 1
        fi

        python -m pip install --upgrade pip twine

        # Artifactory PyPI repositories use the PyPI API endpoint.
        repository_url="${ARTIFACTORY_URL%/}/api/pypi/${ARTIFACTORY_REPO}"
        echo "Publishing ${#wheels[@]} wheel(s)"

        python -m twine upload \
          --non-interactive \
          --repository-url "${repository_url}" \
          -u "${ARTIFACTORY_USERNAME}" \
          -p "${ARTIFACTORY_API_KEY}" \
          "${wheels[@]}"

        wheel_base="${ARTIFACTORY_URL%/}/${ARTIFACTORY_REPO}"
        wheel_prefix="${wheel_base}/"

        wheel_paths=()
        for wheel in "${wheels[@]}"; do
          wheel_name="$(basename "${wheel}")"
          echo "Resolving Artifactory URL for ${wheel_name}"

          search_json="$(curl --fail-with-body --show-error --silent --location --get --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -u "${ARTIFACTORY_USERNAME}:${ARTIFACTORY_API_KEY}" \
            --data-urlencode "name=${wheel_name}" \
            --data-urlencode "repos=${ARTIFACTORY_REPO}" \
            "${ARTIFACTORY_URL%/}/api/search/artifact")"

          result_count="$(jq '.results | length' <<< "${search_json}")"
          if [[ "${result_count}" -ne 1 ]]; then
            echo "Expected exactly 1 Artifactory search result for ${wheel_name}, but got ${result_count}"
            echo "${search_json}"
            exit 1
          fi

          storage_uri="$(jq -r '.results[0].uri // empty' <<< "${search_json}")"
          if [[ -z "${storage_uri}" ]]; then
            echo "Unable to resolve storage URI for ${wheel_name}"
            echo "${search_json}"
            exit 1
          fi

          metadata_json="$(curl --fail-with-body --show-error --silent --location --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -u "${ARTIFACTORY_USERNAME}:${ARTIFACTORY_API_KEY}" \
            "${storage_uri}")"

          download_uri="$(jq -r '.downloadUri // empty' <<< "${metadata_json}")"
          if [[ -z "${download_uri}" ]]; then
            echo "Unable to resolve downloadUri for ${wheel_name}"
            echo "${metadata_json}"
            exit 1
          fi

          wheel_path="${download_uri#${wheel_prefix}}"
          if [[ "${wheel_path}" == "${download_uri}" || -z "${wheel_path}" ]]; then
            echo "Unable to clip Artifactory prefix from downloadUri for ${wheel_name}"
            echo "Expected prefix: ${wheel_prefix}"
            echo "${metadata_json}"
            exit 1
          fi

          wheel_paths+=("${wheel_path}")
        done

        {
          echo "wheel_paths<<EOF"
          printf '%s\n' "${wheel_paths[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

  kitmaker:
    runs-on: [self-hosted, linux]
    needs:
      - publish-wheel
    outputs:
      releases: ${{ steps.submit-kitmaker.outputs.releases }}
    environment: release
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' && needs.publish-wheel.result == 'success' }}

    steps:
    - name: Submit wheel release to Kitmaker
      id: submit-kitmaker
      env:
        KITMAKER_API_ENDPOINT: ${{ secrets.KITMAKER_API_ENDPOINT }}
        IC_KITMAKER_PROJECT_ID: ${{ secrets.IC_KITMAKER_PROJECT_ID }}
        KITMAKER_PROJECT_ID: ${{ secrets.KITMAKER_PROJECT_ID }}
        KITMAKER_TOKEN: ${{ secrets.KITMAKER_TOKEN }}
        KITMAKER_PIC_EMAIL: ${{ secrets.KITMAKER_PIC_EMAIL }}
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        ARTIFACTORY_REPO: ${{ secrets.ARTIFACTORY_REPO }}
        WHEEL_PATHS: ${{ needs.publish-wheel.outputs.wheel_paths }}
        KITMAKER_UPLOAD: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') }}
        # Only a vX.Y.Z tag is a final version and mirrors to PyPI.
        # release/*.*.x builds are rc versions and stay on DevZone.
        KITMAKER_MIRRORING: ${{ startsWith(github.ref, 'refs/tags/v') && 'upload-both' || 'claim-project' }}
      run: |
        set -euo pipefail

        if [[ -z "${KITMAKER_API_ENDPOINT}" || -z "${IC_KITMAKER_PROJECT_ID}" || -z "${KITMAKER_PROJECT_ID}" || -z "${KITMAKER_TOKEN}" || -z "${KITMAKER_PIC_EMAIL}" || -z "${ARTIFACTORY_URL}" || -z "${ARTIFACTORY_REPO}" ]]; then
          echo "Missing one or more required secrets: KITMAKER_API_ENDPOINT, IC_KITMAKER_PROJECT_ID, KITMAKER_PROJECT_ID, KITMAKER_TOKEN, KITMAKER_PIC_EMAIL, ARTIFACTORY_URL, ARTIFACTORY_REPO"
          exit 1
        fi

        if [[ "${KITMAKER_API_ENDPOINT}" != https://* ]]; then
          echo "KITMAKER_API_ENDPOINT must use https://"
          exit 1
        fi

        if [[ "${ARTIFACTORY_URL}" != https://* ]]; then
          echo "ARTIFACTORY_URL must use https://"
          exit 1
        fi

        if [[ -z "${WHEEL_PATHS}" ]]; then
          echo "No wheel paths were produced by publish-wheel job"
          exit 1
        fi

        wheel_base="${ARTIFACTORY_URL%/}/${ARTIFACTORY_REPO}"

        declare -A project_ids=(
          [isaaccapture]="${IC_KITMAKER_PROJECT_ID}"
          [isaacteleop]="${KITMAKER_PROJECT_ID}"
        )
        declare -A payloads
        # Kitmaker requires every wheel in a release to match its project name.
        for project_name in isaaccapture isaacteleop; do
          payload_items=()
          while IFS= read -r wheel_path; do
            [[ -z "${wheel_path}" ]] && continue
            wheel_url="${wheel_base}/${wheel_path}"
            wheel_name="$(basename "${wheel_path}")"
            [[ "${wheel_name}" == "${project_name}-"*.whl ]] || continue
            echo "Queueing wheel for Kitmaker payload: ${wheel_name}"

            payload_items+=("$(jq -cn \
              --arg pic "${KITMAKER_PIC_EMAIL}" \
              --arg url "${wheel_url}" \
              --argjson upload "${KITMAKER_UPLOAD}" \
              --arg mirroring "${KITMAKER_MIRRORING}" \
              '{pic: $pic, job_type: "wheel-release-job", mirroring_strategy: $mirroring, url: $url, size: "small", upload: $upload}')")
          done <<< "${WHEEL_PATHS}"

          if (( ${#payload_items[@]} == 0 )); then
            echo "No wheels found for ${project_name}"
            exit 1
          fi

          payload_array="$(printf '%s\n' "${payload_items[@]}" | jq -s '.')"
          payloads[${project_name}]="$(jq -cn --arg project_name "${project_name}" --argjson payload "${payload_array}" '{project_name: $project_name, payload: $payload}')"
        done

        releases='[]'
        for project_name in isaaccapture isaacteleop; do
          api_url="${KITMAKER_API_ENDPOINT%/}/v0/projects/${project_ids[${project_name}]}/releases"
          echo "Posting ${project_name} wheels to Kitmaker"
          response_json="$(curl --fail-with-body --show-error --silent --location --connect-timeout 10 --max-time 120 \
            -X POST "${api_url}" \
            -H "Authorization: Bearer ${KITMAKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${payloads[${project_name}]}")"
          echo "${response_json}"

          release_uuid="$(jq -r '.release_uuid // empty' <<< "${response_json}")"
          if [[ -z "${release_uuid}" ]]; then
            echo "Kitmaker response missing release_uuid"
            exit 1
          fi

          releases="$(jq -cn --argjson releases "${releases}" \
            --arg project_name "${project_name}" --arg release_uuid "${release_uuid}" \
            '$releases + [{project_name: $project_name, release_uuid: $release_uuid}]')"
        done

        echo "releases=${releases}" >> "$GITHUB_OUTPUT"

  kitmaker-status:
    name: kitmaker-status (${{ matrix.project_name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.kitmaker.outputs.releases) }}
    runs-on: [self-hosted, linux]
    needs:
      - kitmaker
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' && needs.kitmaker.result == 'success' }}

    steps:
    - name: Monitor Kitmaker release status
      env:
        KITMAKER_API_ENDPOINT: ${{ secrets.KITMAKER_API_ENDPOINT }}
        KITMAKER_PROJECT_ID: ${{ matrix.project_name == 'isaaccapture' && secrets.IC_KITMAKER_PROJECT_ID || secrets.KITMAKER_PROJECT_ID }}
        KITMAKER_RELEASE_UUID: ${{ matrix.release_uuid }}
        ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
        ARTIFACTORY_REPO: ${{ secrets.ARTIFACTORY_REPO }}
      run: |
        set -euo pipefail

        if [[ -z "${KITMAKER_API_ENDPOINT}" || -z "${KITMAKER_PROJECT_ID}" || -z "${ARTIFACTORY_URL}" || -z "${ARTIFACTORY_REPO}" ]]; then
          echo "Missing one or more required secrets: KITMAKER_API_ENDPOINT, KITMAKER_PROJECT_ID, ARTIFACTORY_URL, ARTIFACTORY_REPO"
          exit 1
        fi

        # Redact sensitive values that may appear in API responses.
        echo "::add-mask::${KITMAKER_API_ENDPOINT}"
        echo "::add-mask::${KITMAKER_API_ENDPOINT%/}"
        echo "::add-mask::${KITMAKER_RELEASE_UUID}"
        echo "::add-mask::${KITMAKER_PROJECT_ID}"
        echo "::add-mask::${ARTIFACTORY_URL}"
        echo "::add-mask::${ARTIFACTORY_URL%/}"
        echo "::add-mask::${ARTIFACTORY_REPO}"

        if [[ "${KITMAKER_API_ENDPOINT}" != https://* ]]; then
          echo "KITMAKER_API_ENDPOINT must use https://"
          exit 1
        fi

        if [[ -z "${KITMAKER_RELEASE_UUID}" ]]; then
          echo "No release_uuid was produced by the kitmaker job"
          exit 1
        fi

        status_url="${KITMAKER_API_ENDPOINT%/}/v0/status/${KITMAKER_RELEASE_UUID}"
        # Limit total polling time to under an hour with exponential backoff starting at 30s
        max_attempts=15
        sleep_seconds=30
        # Reason reported if every attempt is exhausted; refined as we poll so
        # the final message reflects the last condition seen (e.g. repeated
        # 5xx or network errors) instead of always claiming a plain timeout.
        last_reason="release status never reached a terminal state"

        for ((attempt=1; attempt<=max_attempts; attempt++)); do
          echo "Polling Kitmaker status (attempt ${attempt}/${max_attempts})"

          # Capture the body and HTTP status separately (instead of relying on
          # --fail-with-body) so we can tell a transient failure worth retrying
          # — a network error or a 5xx — apart from a permanent one (a 4xx such
          # as auth/not-found) that will never succeed and should fail fast.
          # Don't let a network failure abort the step under `set -e`.
          curl_status=0
          curl_output="$(curl --show-error --silent --location --connect-timeout 10 --max-time 60 \
            --write-out '\n%{http_code}' \
            "${status_url}")" || curl_status=$?
          http_code="${curl_output##*$'\n'}"
          response_json="${curl_output%$'\n'*}"

          if (( curl_status != 0 )); then
            # Network-level failure (timeout, connection reset, DNS): transient.
            last_reason="curl request kept failing (last exit ${curl_status})"
            echo "curl request failed (exit ${curl_status}); will retry on the next attempt"
          else
            echo "${response_json}"

            if (( http_code >= 500 )); then
              last_reason="Kitmaker status endpoint kept returning HTTP ${http_code}"
              echo "Kitmaker status request returned HTTP ${http_code}; will retry on the next attempt"
            elif (( http_code >= 400 )); then
              echo "Kitmaker status request returned HTTP ${http_code}"
              exit 1
            else
              # A non-JSON body (e.g. a proxy/gateway error page served with a
              # 2xx) is itself transient: leave status empty and keep polling
              # rather than letting jq's parse error abort the step under set -e.
              status="$(jq -r '.status // empty' <<< "${response_json}" 2>/dev/null || true)"

              if [[ "${status}" == "completed" ]]; then
                echo "Kitmaker release ${KITMAKER_RELEASE_UUID} completed"
                exit 0
              fi

              if [[ "${status}" == "failed" ]]; then
                echo "Kitmaker release ${KITMAKER_RELEASE_UUID} failed"
                exit 1
              fi
            fi
          fi

          if (( attempt == max_attempts )); then
            break
          fi

          sleep "${sleep_seconds}"
          sleep_seconds=$(( sleep_seconds * 125 / 100 ))
        done

        echo "Timed out after ${max_attempts} attempts waiting for Kitmaker release ${KITMAKER_RELEASE_UUID}: ${last_reason}"
        exit 1
