version = 1

# Apply Apache-2.0 and copyright to .github/ so REUSE lint passes without per-file headers
[[annotations]]
path = ".github/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "SECURITY.md"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# Cursor rule files (.mdc) keep frontmatter clean (no SPDX header); cover them
# here so REUSE lint passes, mirroring the .github/** override above.
[[annotations]]
path = ".cursor/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "examples/cloudxr_mujoco_teleop/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 HTC Corporation"
SPDX-License-Identifier = "Apache-2.0"

# MuJoCo is fetched at build time into _deps/ and its shared library is redistributed in
# the wheel under a private SONAME; deps/third_party/Mujoco.cmake stages its LICENSE
# beside the binary. Nothing from the fetched tree is committed here.
[[annotations]]
path = "deps/third_party/Mujoco.cmake"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# Chromium's physical key code table, vendored verbatim (see its README.md).
[[annotations]]
path = "deps/third_party/chromium/include/chromium/dom_code_data.inc"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2013 The Chromium Authors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "deps/third_party/chromium/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2015 The Chromium Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# EgoPost's default never overrides upstream headers or sidecar licenses.
# The license-only scaffold has no covered files yet; the canonical text is reserved for imports.
[[annotations]]
path = "src/python/isaaccapture_egopost/**"
precedence = "closest"
SPDX-License-Identifier = "LicenseRef-OpenMDW-1.1"

[[annotations]]
path = ["examples/camera_streamer/pyproject.toml", "examples/camera_streamer/__init__.py", "examples/camera_streamer/televiz/camera_receiver/requirements.txt", "examples/camera_streamer/televiz/camera_receiver/.gitignore", "examples/camera_streamer/televiz/camera_receiver/README.md", "examples/camera_streamer/televiz/argus_sender/TESTING.md", "examples/camera_streamer/televiz/argus_sender/WIRE_FORMAT.md", "examples/camera_streamer/televiz/argus_sender/.gitignore", "examples/camera_streamer/televiz/argus_sender/CMakeLists.txt", "examples/camera_streamer/televiz/argus_sender/README.md", "examples/camera_streamer/televiz/cuda_ipc_consumer/requirements.txt", "examples/camera_streamer/televiz/cuda_ipc_consumer/.gitignore", "examples/camera_streamer/televiz/argus_sender/configs/hardware_stereo_smoke.yaml", "examples/camera_streamer/televiz/argus_sender/src/EGLGlobal.h", "examples/camera_streamer/televiz/argus_sender/src/Error.h", "examples/camera_streamer/televiz/argus_sender/src/EGLGlobal.cpp", "examples/camera_streamer/televiz/argus_sender/src/NvBufSurfaceLite.cpp", "examples/camera_streamer/televiz/argus_sender/cmake/Tests.cmake", "examples/camera_streamer/tests/hardware/avs1_smoke.py"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 NVIDIA CORPORATION & AFFILIATES"
SPDX-License-Identifier = "LicenseRef-NVIDIA-Internal-Review"
