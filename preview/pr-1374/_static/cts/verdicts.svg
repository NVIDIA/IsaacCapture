<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 566" role="img" aria-labelledby="title desc">
<title id="title">Checker verdict ladder</title>
<desc id="desc">If any FAIL is blamed on the device the verdict is fail, exit status 1. Otherwise, if any FAIL is blamed on the performance it is retake, exit status 2. Otherwise, if a required check is unanswered or no check answered at all it is insufficient_data, exit status 3. Otherwise it is pass, exit status 0.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6270"/></marker>
</defs>
<rect width="420" height="566" fill="#ffffff"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<text x="16" y="30" font-size="21" font-weight="700" fill="#1c1f24">How the checker picks the verdict</text>
<text x="16" y="54" font-size="16" fill="#5a6270">Ask in order; the first yes decides.</text>
<rect x="16.0" y="76" width="212.0" height="92" rx="8" fill="#ffffff" stroke="#b9bfc8" stroke-width="1.5"/>
<text x="32" y="106" font-size="17" font-weight="600" fill="#1c1f24">Any FAIL</text>
<text x="32" y="128" font-size="17" fill="#1c1f24">blamed on the</text>
<text x="32" y="150" font-size="17" fill="#1c1f24">device?</text>
<line x1="228.0" y1="122" x2="260.0" y2="122" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245" y="114" font-size="14" font-weight="600" fill="#5a6270" text-anchor="middle">yes</text>
<rect x="262.0" y="92" width="142.0" height="60" rx="8" fill="#a32820"/>
<text x="333" y="117" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">fail</text>
<text x="333" y="139" font-size="15" fill="#ffffff" text-anchor="middle">exit 1</text>
<line x1="56.0" y1="168" x2="56.0" y2="212" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="68" y="196" font-size="14" font-weight="600" fill="#5a6270">no</text>
<rect x="16.0" y="214" width="212.0" height="92" rx="8" fill="#ffffff" stroke="#b9bfc8" stroke-width="1.5"/>
<text x="32" y="244" font-size="17" font-weight="600" fill="#1c1f24">Any FAIL</text>
<text x="32" y="266" font-size="17" fill="#1c1f24">blamed on the</text>
<text x="32" y="288" font-size="17" fill="#1c1f24">performance?</text>
<line x1="228.0" y1="260" x2="260.0" y2="260" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245" y="252" font-size="14" font-weight="600" fill="#5a6270" text-anchor="middle">yes</text>
<rect x="262.0" y="230" width="142.0" height="60" rx="8" fill="#b07100"/>
<text x="333" y="255" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">retake</text>
<text x="333" y="277" font-size="15" fill="#ffffff" text-anchor="middle">exit 2</text>
<line x1="56.0" y1="306" x2="56.0" y2="350" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="68" y="334" font-size="14" font-weight="600" fill="#5a6270">no</text>
<rect x="16.0" y="352" width="212.0" height="92" rx="8" fill="#ffffff" stroke="#b9bfc8" stroke-width="1.5"/>
<text x="32" y="382" font-size="17" font-weight="600" fill="#1c1f24">A required check</text>
<text x="32" y="404" font-size="17" fill="#1c1f24">unanswered, or</text>
<text x="32" y="426" font-size="17" fill="#1c1f24">nothing answered?</text>
<line x1="228.0" y1="398" x2="260.0" y2="398" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="245" y="390" font-size="14" font-weight="600" fill="#5a6270" text-anchor="middle">yes</text>
<rect x="262.0" y="368" width="142.0" height="60" rx="8" fill="#5a5a5a"/>
<text x="333" y="393" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">insufficient_data</text>
<text x="333" y="415" font-size="15" fill="#ffffff" text-anchor="middle">exit 3</text>
<line x1="56.0" y1="444" x2="56.0" y2="488" stroke="#5a6270" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="68" y="472" font-size="14" font-weight="600" fill="#5a6270">no</text>
<rect x="16.0" y="490" width="212.0" height="60" rx="8" fill="#1f7a44"/>
<text x="122" y="515" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">pass</text>
<text x="122" y="537" font-size="15" fill="#ffffff" text-anchor="middle">exit 0</text>
</g>
</svg>
