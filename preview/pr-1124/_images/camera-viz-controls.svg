camera_viz XR controller bindings. Kept in sync with
examples/camera_viz/controls/bindings.py, which is the source of truth.

Deliberately uses no *-opacity, no gradients and no nested transforms: SVG
rasterisers outside the browser drop or mis-compose all three, so avoiding them
means the file can be proofed by rendering it before it ships.
-->
