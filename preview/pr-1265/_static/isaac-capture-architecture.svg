<title id="title">Isaac Capture architecture</title>
<desc id="desc">Isaac Teleop and the Ego Pipeline use shared device plugins, retargeters, and data utilities. Isaac Lab and Sim, Isaac ROS, and other ROS stacks use Isaac Capture. GitHub and PyPI distribute the library.</desc>
