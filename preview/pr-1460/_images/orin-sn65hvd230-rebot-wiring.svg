<text x="72" y="969" font-size="10.5" fill="#6B5220">Power the boards from 3.3 V, never 5 V.&#160;&#160;No motor power &#8658; no CAN replies.</text>
<text x="72" y="988" font-size="10" fill="#8A7340">Pad order is schematic &#8212; match the silkscreen (TX / RX may read CTX / CRX).</text>
<text x="56" y="1024" font-size="10.5" fill="#5A6472">Pin 1 is at the top right of J30. 3.3 V is on pins 1 and 17 only; grounds are on 6, 9, 14, 20, 25, 30, 34, 39.</text>
