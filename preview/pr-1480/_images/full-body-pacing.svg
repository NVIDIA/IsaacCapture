<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 504" role="img" aria-labelledby="title desc">
<title id="title">Full-body suite pacing</title>
<desc id="desc">The full-body take runs 10 timed steps of 5, 6, 7, 5, 5, 5, 5, 10, 6 and 6 seconds, 60 seconds in all, separated by gaps the performer sets; steps 1 to 3 and 10 are held poses, steps 4 to 9 are motions. The zoomed step is step 2, the T-pose, held for 6 seconds. Each step plays a spoken cue (the panel says listen), then waits with no time limit while the panel says ready when you are, get into position. Pressing the controller trigger or the space bar in the browser plays a beep and starts the timed window; the panel says hold and counts down while the performer holds the pose or does the motion, and a tick closes it before the next cue. A press during the cue cuts it short; a press during the window is ignored.</desc>
<defs>
<pattern id="pace" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eef0f3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b9bfc8" stroke-width="2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6270"/></marker>
</defs>
