<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">Hand suite pacing</title>
<desc id="desc">The hand take runs 11 timed steps in about 111 seconds after you press Start recording. Each step plays a spoken cue (the panel says listen), then three counts one second apart while the panel shows 3, 2, 1 under get into position, then a beep opens the hold. The panel says hold and counts down; a tick closes it and the next cue plays. In a held pose the first 40 percent of the hold is settling and only the last 60 percent is measured.</desc>
<defs>
<pattern id="pace" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eef0f3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b9bfc8" stroke-width="2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6270"/></marker>
</defs>
