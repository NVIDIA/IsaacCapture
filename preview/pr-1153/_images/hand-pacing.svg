<text x="16" y="30" font-size="21" font-weight="700" fill="#1c1f24">The whole take: 11 steps, just under 2 min</text>
<text x="16" y="54" font-size="16" fill="#5a6270">The timer sets the pace. Grey: cue, count-in. Green: hold.</text>
