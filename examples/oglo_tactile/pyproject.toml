[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-oglo-tactile"
version = "0.0.0"  # Internal example - not versioned
description = "OGLO tactile glove: heatmap renderer and teleop recording"
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr]",
    "numpy>=1.23.0",
    "pillow",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# oglo_tactile -- see the packaging rules in examples/README.md.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/oglo_tactile"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
