[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-oglo-tactile"
version = "0.0.0"  # Internal example - not versioned
description = "OGLO tactile glove: heatmap renderer and teleop recording"
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr]",
    "numpy>=1.23.0",
    "pillow",
]

[project.optional-dependencies]
# The in-headset overlay uploads the heatmap through CUDA; match your CUDA
# major version. Without it the renderer still writes PNGs.
gpu = ["cupy-cuda12x"]

# `isaaccapture_examples` is a PEP 420 namespace shared by every example dist and
# must stay without an __init__.py. `only-include` + `sources`, not `packages`:
# the latter keeps only the last path component and would root the wheel at a
# bare top-level `oglo_tactile/`.
[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/oglo_tactile"]
sources = ["python"]
