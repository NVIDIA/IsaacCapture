#
# V4L2 source — same YAML drives both camera_viz (receiver) and
# camera_streamer (RTP sender). Flip top-level ``source: local|rtp`` to
# control what camera_viz opens; camera_streamer always reads cameras +
# rtp ports + streaming.host.
#
# Defaults match the ZED Mini's UVC HD720 side-by-side mode at
# /dev/video0 (2560x720 YUYV @ 30fps; cv2 negotiates YUYV→BGR on CPU,
# GPU then channel-swaps BGR→RGBA). For a regular UVC webcam, edit
# device/width/height/fps per ``v4l2-ctl --list-formats-ext``.

source: local                   # local | rtp
streaming:
  host: 127.0.0.1               # camera_streamer target (override with --host)
encoder: auto                   # auto | native | gstreamer
                                # auto picks native NVENC on desktop, GStreamer on Jetson

cameras:
  - name: cam
    enabled: true
    type: v4l2
    device: /dev/video0
    width: 2560
    height: 720
    fps: 30
    # fourcc: MJPG              # only if the device offers MJPG (ZED V4L2 is YUYV-only)
    rtp:                        # used by camera_streamer + source: rtp receivers
      port: 5000
      bitrate_mbps: 15          # camera_streamer default; lower for tight uplinks
      # gop:                    # default: fps*5 (IDR every 5 s, ULL tuning)

display:
  mode: xr                      # xr | window (xr is the default)
  window:
    width: 2560
    height: 720
  xr:
    near_z: 0.05
    far_z: 100.0
    # How long create() waits for the headset to connect. -1 (default) waits
    # forever, so you can start the viewer before putting the Quest on; 0
    # fails fast. Ctrl-C is only delivered once the wait ends.
    system_wait_seconds: -1
  clear_color: [0.0, 0.0, 0.0, 0.0]
  placements:
    cam:                        # size defaults to 1.0 m wide × aspect-derived height
      lock_mode: lazy
      distance: 1.0
