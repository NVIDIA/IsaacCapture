[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-manus-calibration"
version = "0.0.0"  # Internal example - not versioned
description = "Standalone Manus glove calibration with a browser page"
requires-python = ">=3.11,<3.14"
# Standard library only: calibration needs no OpenXR, CUDA, capture session or UI toolkit.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# manus_calibration -- see the packaging rules in examples/README.md.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/manus_calibration"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
