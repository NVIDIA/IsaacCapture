[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-haptic-feedback"
version = "0.0.0"  # Internal examples - not versioned
description = "Isaac Teleop haptic feedback CLI examples (OpenXR controller)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr]",
    "numpy>=1.23.0",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# haptic_feedback -- see the packaging rules in examples/README.md.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/haptic_feedback"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
