[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaaccapture-examples-tactile"
version = "0.0.0"
description = "Isaac Teleop tactile feeder and printer"
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr]",
    "numpy>=1.23.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/tactile"]
sources = ["python"]

[tool.uv.sources]
isaaccapture = { path = "../..", editable = true }
