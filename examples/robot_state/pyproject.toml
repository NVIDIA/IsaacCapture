[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-robot-state"
version = "0.0.0"  # Internal example - not versioned
description = "Isaac Capture robot state example: a stand-in robot and a stand-in harness"
requires-python = ">=3.11,<3.14"
# No version on isaaccapture: the example runs against the one next to it -- this
# checkout, or the wheel install_python_example() pins into the installed copy.
dependencies = [
    "isaaccapture",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# robot_state -- see the packaging rules in examples/README.md. The directory
# is taken whole, so the wheel carries descriptions/*.toml.
[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/robot_state"]
sources = ["python"]

[tool.uv.sources]
# Editable, so edits under src/python/ need no rebuild. Dropped from the
# installed copy, which has no repo above it.
isaaccapture = { path = "../..", editable = true }
