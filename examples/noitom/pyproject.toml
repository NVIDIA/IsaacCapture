[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-noitom"
version = "0.0.0"  # Internal example - not versioned
description = "Noitom mocap suit examples: retargeting, Isaac Lab task, MCAP recording"
requires-python = ">=3.11,<3.14"
# isaaclab and gymnasium are deliberately absent: only noitom_tasks imports them,
# and it runs inside Isaac Lab's own interpreter, which provides them.
dependencies = [
    "isaaccapture[cloudxr]",
    "numpy>=1.23.0",
    "scipy",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# noitom -- see the packaging rules in examples/README.md.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/noitom"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
