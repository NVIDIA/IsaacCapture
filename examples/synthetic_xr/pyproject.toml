[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaaccapture-examples-synthetic-xr"
version = "0.2.0"
description = "Synthetic XR Teleoperation desktop examples"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
franka = ["numpy>=1.23", "scipy>=1.10", "websocket-client>=1.6"]

[project.scripts]
synthetic-xr = "isaaccapture_examples.synthetic_xr.launch:main"

[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/synthetic_xr"]
sources = ["python"]
