[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-cloudxr-mujoco-teleop"
version = "0.1.0"
description = "Visualize OpenXR / CloudXR headset + controller poses in MuJoCo."
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr]",
    "mujoco>=3.0",
    "numpy>=1.22.2",
    "scipy>=1.10",
]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# cloudxr_mujoco_teleop -- see the packaging rules in examples/README.md.
#
# vive_assets/ lives inside the package because the modules resolve it from
# __file__, so the meshes must travel with them.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/cloudxr_mujoco_teleop"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
