[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-mcap-record-replay"
version = "0.0.0"  # Internal example - not versioned
description = "Isaac Teleop MCAP record / replay example with viser visualization"
requires-python = ">=3.11,<3.14"
# No version on isaaccapture: the example runs against the one next to it -- this
# checkout, or the wheel install_python_example() pins into the installed copy.
dependencies = [
    "isaaccapture[cloudxr]",
    "mcap>=1.2.0",
    "numpy>=1.23.0",
    "py-soma-x==0.3.1",
    "viser>=0.2.0",
]

# `isaaccapture_examples` is a PEP 420 namespace shared by every example dist and
# must stay without an __init__.py. `only-include` + `sources`, not `packages`:
# the latter keeps only the last path component and would root the wheel at a
# bare top-level `mcap_record_replay/`.
[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/mcap_record_replay"]
sources = ["python"]

[tool.uv.sources]
# Editable, so edits under src/python/ need no rebuild. Dropped from the
# installed copy, which has no repo above it.
# TODO(#880): the example install paths are not covered in CI.
isaaccapture = { path = "../..", editable = true }
