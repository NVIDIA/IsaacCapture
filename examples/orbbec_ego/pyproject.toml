[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaaccapture-examples-orbbec-ego"
version = "0.0.0"
description = "Orbbec EGO structured replay"
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture",
    "mcap>=1.2,<2",
]

[tool.hatch.build]
only-include = ["python/isaaccapture_examples/orbbec_ego"]

[tool.hatch.build.targets.wheel]
sources = ["python"]

[tool.uv.sources]
isaaccapture = { path = "../..", editable = true }
