# Default camera settings the launcher uploads to the sender. This file is specific to one rig: a single SHW5G head
# camera on the SIPL backend, HEVC over AVS1/TCP, with the sensor timing extension and the UDP clock responder on.
# CAMERA_SETTINGS.md describes every key.
#
# Another rig needs its own file (pass it with --sender-config): a different SIPL platform or camera changes the
# `sipl` block, and the Argus backend has no `sipl` block and selects sensor modes through `cameras[].mode`. The
# platform file, config name, link masks and tuning directory here describe the tested head-camera setup. Sensor
# size and rate come from the platform file, so no dimensions are set.

version: 1
capture_backend: sipl

sipl:
  platform_config_json: /opt/isaaccapture/camera-platform.json
  platform_config_name: SHW5G_2
  link_masks: [256, 0]
  nito_dir: /var/nvidia/nvcam/settings/sipl

network:
  bind: 0.0.0.0
  port: 5000
  # Both are needed for a page latency measured from sensor capture time: the timing records carry the capture
  # instant, and the responder lets the PC map the sender's clock onto its own. A client must use the same port.
  timing_extension: true
  clock_port: 5611

runtime:
  frames: 0
  kpi: true
  log_interval_s: 1

streams:
  - id: head
    type: mono
    cameras:
      - {device: 0, mode: 0}
    output:
      codec: hevc
      fps: 30
      bitrate_mbps: 4
