[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The dist name mirrors the import path, so an installed example claims no bare
# top-level name in site-packages.
name = "isaaccapture-examples-teleop"
version = "0.1.0"
description = "Isaac Teleop Retargeting Examples"
requires-python = ">=3.11,<3.14"
dependencies = [
    "isaaccapture[cloudxr,retargeters]",
    "glfw>=2.7",  # keyboard_printer_example: the window and its platform constants
]

[project.optional-dependencies]
# The bimanual examples' --enable-tuning window. Optional because imgui does not
# install on every supported Python; see README.md.
ui = ["isaaccapture[ui]"]

# `only-include` + `sources`, not `packages`, and no __init__.py above
# teleop -- see the packaging rules in examples/README.md.
#
# config/ lives inside the package because the bimanual examples resolve it
# from __file__, so the YAML and URDF must travel with them.
[tool.hatch.build]
only-include = ["python/isaaccapture_examples/teleop"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
