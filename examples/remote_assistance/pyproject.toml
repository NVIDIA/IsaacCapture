[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "isaaccapture-remote-assistance"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = ["isaac-media-transport==0.1.0", "pyyaml>=6", "numpy>=1.26,<3"]
[project.optional-dependencies]
gstreamer = ["PyGObject==3.48.2"]
viewer = ["opencv-python>=4.5,<5"]
[tool.setuptools.packages.find]
include = ["remote_assistance*"]
