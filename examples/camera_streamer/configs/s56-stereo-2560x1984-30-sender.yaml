version: 1
network:
  bind: 0.0.0.0
  port: 5000
  reconnect_ms: 1000
runtime:
  frames: 0
  kpi: true
  log_interval_s: 5
alignment:
  warmup_frames: 30
  interval_frames: 30
streams:
  - id: head
    type: stereo
    cameras:
      - {device: 0, mode: 1}
      - {device: 1, mode: 1}
    output:
      width: 2560
      height: 1984
      fps: 30
      codec: hevc
      rotation: 0
      resize_mode: strict
      bitrate_mbps: 30
      gop: 30
