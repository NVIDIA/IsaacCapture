version: 1
network:
  bind: 0.0.0.0
  port: 5000
  reconnect_ms: 1000
runtime:
  frames: 0
  kpi: true
  log_interval_s: 5
alignment:
  warmup_frames: 30
  interval_frames: 30
streams:
- id: head
  type: mono
  cameras:
  - device: 0
    mode: 0
  output:
    width: 1280
    height: 720
    fps: 60
    codec: hevc
    rotation: 0
    resize_mode: strict
    bitrate_mbps: 30
    gop: 60
  receiver:
    output_format: nv12
    ring_depth: 6
    ipc:
      mono: head
receiver:
  host: 127.0.0.1
  gpu_id: 0
  max_record_bytes: 268435456
  stats_log_interval_s: 5
  receive_fps_warning_threshold: 48.0
  receive_fps_warning_interval_s: 10
ipc:
  socket_path: /tmp/isaac-camera-streamer.sock
  owner_name: isaac_camera_streamer
  queue_size: 64
