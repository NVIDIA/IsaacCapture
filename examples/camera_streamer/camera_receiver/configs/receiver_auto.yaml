# No streams list: the receiver takes the stream count, sizes, mono/stereo type
# and names from the sender's bundles, and follows a sender that restarts with a
# different layout. Streams are published as NV12.
version: 1
receiver:
  host: 127.0.0.1
  port: 5000
  gpu_id: 0
  max_record_bytes: 268435456
  stats_log_interval_s: 0
  # Warn when a stream arrives below this fraction of the rate its sender
  # advertises. This also reports a configured camera that is not delivering.
  receive_fps_warning_fraction: 0.9
  receive_fps_warning_interval_s: 10.0
ipc:
  socket_path: /tmp/camera_receiver_avs1_cuda_ipc.sock
  owner_name: camera_receiver_avs1
  queue_size: 1024
