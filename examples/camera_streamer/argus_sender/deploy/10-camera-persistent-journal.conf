#
# Installed verbatim by deploy_argus_sender.sh into
# /etc/systemd/journald.conf.d/ during reference camera AGX provisioning.
#
# The reference camera AGXs ship with volatile journald (Storage=auto with no
# /var/log/journal), so `journalctl` history is wiped on every reboot. After a
# real spontaneous camera fault that forces a reboot there is then no journal
# left to post-mortem -- exactly when the argus_sender / nvargus logs matter
# most. Storage=persistent keeps the journal on disk across reboots.
#
# Capped so a chatty AGX cannot fill the (small) eMMC: SystemMaxUse bounds the
# on-disk journal, SystemKeepFree keeps headroom for everything else.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
