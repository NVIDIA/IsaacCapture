version: 1

network:
  bind: 127.0.0.1
  port: 55000
  reconnect_ms: 100

runtime:
  frames: 120
  kpi: true

alignment:
  warmup_frames: 60
  interval_frames: 60

streams:
  - id: smoke_stereo
    type: stereo
    cameras:
      - {device: 0, mode: 0}
      - {device: 1, mode: 0}
    output:
      fps: 60
      codec: hevc
      rotation: 0
      resize_mode: strict
      bitrate_mbps: 50
      gop: 60
