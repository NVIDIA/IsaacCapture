The live picture: the block the example's launcher (viewer_live) puts before the
end of the experiment's page. The page above it is the experiment's own.

The page with the live picture showing is the live view. The script fetches
each camera picture by its number, draws it and tells the viewer that it has
(POST /api/live/shown), which the viewer turns into VIEW_STATUS for the robot.
A picture counts as showing only while at least three quarters of its area lie
inside the browser window, in a visible tab.

The viewer serves each load of the page on its own machine with a view token:
a secret that goes out with every request for a picture and with every
acknowledgement. Only the page loaded last has the valid one. A page opened
from another machine gets no view token: it shows the pictures to watch and
tells the viewer nothing. So does, from then on, a page that a newer load
replaced: only a load of the page makes it the live view again.

The viewer instance is one start of the viewer, to its end; each page is
served with its name. A page that hears another instance was open across a
restart of the viewer: it loads itself again, once for each instance, and so
gets a view token of the viewer that runs now. It does so only while that
viewer has given no page a view token: a load that a page makes by itself
takes the live view from no page. While the viewer gives no answer the page
keeps its last picture, says how old it is and asks again every second.

The note under the button says, in the warning colour, why the picture is not
live or does not count.

The live arm: while the page follows the newest run, the second part of the
script asks the viewer for each ROBOT_STATE as it arrives and hands the arm of
it to the page's own draw(), in the place of the recorded one. A line under
the 3D scene says which arm is drawn and how old the obstacle map beside it is.
The arm is called live only while the joints' readings are fresh; older ones
are drawn as the pose the joints were last read at, with their age. Each draw
is timed, and states are skipped so that drawing the arm takes at most about
half of the page's time.
-->
<script>
'use strict';
// The live picture.
(function () {
  // The page's own picture, its "Follow live" button and its two switches.
  // Without one of them this script does nothing.
  const photo = document.getElementById('photo');
  const followLive = document.getElementById('live');
  let known = false;
  try { known = typeof follow === 'boolean' && typeof playing === 'boolean'; } catch (error) { known = false; }
  if (!known || !photo || !followLive || !photo.parentNode) return;

  const PICTURE = '/api/live.jpg', SHOWN = '/api/live/shown', STATE = '/api/live.json';
  // The view token of this load of the page; the viewer puts it in here.
  const TOKEN = '__VIEW_TOKEN__';
  // The viewer instance that served this page; the viewer puts it in here.
  const INSTANCE = '__VIEWER_INSTANCE__';
  // Without a view token this page was opened from another machine.
  const REMOTE = TOKEN === '';
  // The share of the live picture's area that must lie inside the window.
  const SHARE = 0.75;
  // A request that failed is made again after this long.
  const RETRY_MS = 1000;
  // A request without an answer for this long has failed.
  const SILENT_MS = 4000;
  // A picture that has been on the page for longer than this is called old.
  const OLD_MS = 2000;
  // The page loads itself again only on an answer of the viewer this young.
  const HEARD_MS = 1500;
  const WARN = '#ffbd69';
  const WATCH_ONLY = 'watch only: the live view is the page opened on the workstation';
  const ANOTHER_PAGE = 'watch only: another page on the workstation is the live view; reload this page to make it the live view';
  const NO_PAGE = 'watch only: no page is the live view now; reload this page to make it the live view';
  const RESTARTED = 'the viewer was restarted: this page loads itself again';
  const LOADS_LATER = 'the viewer was restarted: this page loads itself again once Live picture is pressed';
  const NOT_LOADED = 'watch only: the viewer was restarted; reload this page to make it the live view';
  const UNREACHED = 'the viewer cannot be reached';
  const runs = document.getElementById('run');
  const bar = document.createElement('div');
  const button = document.createElement('button');
  const note = document.createElement('div');
  const picture = document.createElement('canvas');
  const reason = document.createElement('span');
  const box = document.createElement('section');
  box.id = 'livePanel';
  box.className = 'panel';
  box.style.marginBottom = '18px';
  bar.className = 'bar';
  button.id = 'livePicture';
  reason.id = 'livePictureWhy';
  reason.style.color = WARN;
  note.id = 'livePictureNote';
  note.className = 'muted';
  note.style.padding = '0 14px 12px';
  picture.id = 'livePhoto';
  // The page styles every canvas as its 3D scene: 580 px high, to be dragged.
  picture.style.width = '100%';
  picture.style.height = 'auto';
  picture.style.cursor = 'default';
  picture.style.background = 'none';
  picture.style.touchAction = 'auto';
  picture.style.display = 'none';
  bar.append(button, reason);
  box.append(bar, note, picture);
  // At the top of the column that holds the page's own picture: in the window
  // without scrolling.
  const column = typeof photo.closest === 'function' ? photo.closest('aside') : null;
  if (column) column.insertBefore(box, column.firstChild);
  else photo.parentNode.insertBefore(box, photo);

  // wanted: the operator's choice. available, why: the viewer's answer.
  // shown: the live picture is on the page, since shownAt. turn: counts the
  // changes of shown.
  let wanted = true, available = false, why = 'asking the viewer';
  let shown = false, shownAt = 0, turn = 0;
  // replaced: another load of the page has the valid view token, and this
  // page only watches from now on. other: the viewer instance that answers,
  // when it is not the one that served this page. vacantFor: the instance
  // that said that none of its pages has a view token. countingAsks: the page
  // whose pictures count asks the viewer for them.
  let replaced = false, other = '', vacantFor = '', countingAsks = false;
  // failed: why the viewer's last answer did not come; '' when it came.
  // heardAt: when its last answer came. loading: this page loads itself again.
  let failed = '', heardAt = 0, loading = false;
  // inWindow: most of the live picture lies inside the browser window.
  // counted: a picture drawn now is acknowledged as one the person sees.
  let inWindow = false, counted = false;
  // The number of the picture drawn last, when the last ones were drawn, when
  // the last one was, and what the viewer tells the robot of the live view.
  let drawnSeq = 0, drawnAt = [], drawnLast = 0, view = null;
  // The viewer instance this tab loaded itself again for. It is kept in the
  // tab's history entry, which outlives the load: one load for each instance.
  let loadedFor = '';
  try { loadedFor = (history.state && history.state.liveInstance) || ''; } catch (error) { loadedFor = ''; }

  // Whether the operator's choice is the live picture: not the map picture,
  // a replay or an older run.
  const chosen = () => wanted && follow && !playing && (!runs || runs.value === 'latest');
  // Whether this page only watches: its pictures count for nothing, and it
  // tells the viewer nothing.
  const watching = () => REMOTE || replaced || other !== '';
  // Ends a request that has no answer after SILENT_MS, where the browser can.
  const limit = () => (typeof AbortSignal === 'function' && typeof AbortSignal.timeout === 'function'
    ? AbortSignal.timeout(SILENT_MS) : undefined);

  // The browser says how much of the live picture is inside the window.
  const observer = typeof IntersectionObserver === 'function'
    ? new IntersectionObserver(entries => {
      const last = entries[entries.length - 1];
      inWindow = last.isIntersecting && last.intersectionRatio >= SHARE;
      sync();
    }, {threshold: [0, SHARE, 1]})
    : null;

  // Where the browser cannot say: the same from the picture's box.
  function boxInWindow() {
    const at = picture.getBoundingClientRect();
    const wide = Math.min(at.right, window.innerWidth) - Math.max(at.left, 0);
    const high = Math.min(at.bottom, window.innerHeight) - Math.max(at.top, 0);
    const area = at.width * at.height;
    return area > 0 && wide > 0 && high > 0 && wide * high >= SHARE * area;
  }

  function acknowledge(seq, visible) {
    if (watching()) return;
    fetch(SHOWN, {method: 'POST', cache: 'no-store',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({seq: seq, visible: visible, token: TOKEN})}).catch(() => {});
  }

  // Whether a picture drawn now is one the person sees. When that ends, the
  // viewer is told at once that the picture drawn last shows no longer.
  function recount() {
    if (!observer) inWindow = shown && boxInWindow();
    const count = !watching() && shown && inWindow && !document.hidden;
    if (count !== counted) {
      counted = count;
      if (!count && drawnSeq) acknowledge(drawnSeq, false);
    }
    return counted;
  }

  // The viewer was restarted: load this page again, for a view token of the
  // viewer that runs now. Once for each viewer instance, and only on an
  // answer of the viewer that has just come: a load that fails leaves no
  // page. A load of this kind takes the view token from no page: it is made
  // only while the viewer says that none of its pages has one, not in a
  // hidden tab, which loads once it shows, not on the map picture, in a
  // replay or on an older run, which a load would end, and not by a page
  // that was replaced, which stays a watch-only page.
  function fresh() {
    if (!other || replaced || loading || failed || document.hidden || loadedFor === other) return;
    if (!chosen()) return;
    if (!REMOTE && vacantFor !== other) return;
    if (Date.now() - heardAt > HEARD_MS) return;
    try {
      history.replaceState(Object.assign({}, history.state, {liveInstance: other}), '');
      location.reload();
      loading = true;
    } catch (error) {
      // No load from here: the note says to reload.
      loadedFor = other;
    }
  }

  // Fetch and draw picture after picture while the live picture is on the
  // page, and acknowledge each one the person sees. The viewer answers each
  // request once it has a newer picture. A page that only watches asks for
  // pictures that count for nothing.
  async function pictures(mine) {
    while (shown && mine === turn) {
      let wait = 0;
      const watch = watching();
      try {
        const answer = await fetch(`${PICTURE}?after=${drawnSeq}${watch ? '&watch=1' : ''}`,
          watch ? {cache: 'no-store', signal: limit()}
            : {cache: 'no-store', signal: limit(), headers: {'X-View-Token': TOKEN}});
        if (answer.status === 403 && !watch) {
          // This page's view token is valid no longer, and never will be
          // again: the viewer is another instance, which is asked about
          // itself at once, or a newer load of the page counts. The pictures
          // go on, to watch.
          const instance = answer.headers.get('X-Viewer-Instance');
          if (instance && instance !== INSTANCE) {
            other = instance;
            ask();
          } else {
            replaced = true;
          }
          sync();
          continue;
        }
        if (answer.status === 200) {
          const seq = Number(answer.headers.get('X-Picture-Seq'));
          const bitmap = await createImageBitmap(await answer.blob());
          if (!shown || mine !== turn) { bitmap.close(); return; }
          if (picture.width !== bitmap.width || picture.height !== bitmap.height) {
            picture.width = bitmap.width;
            picture.height = bitmap.height;
          }
          picture.getContext('2d').drawImage(bitmap, 0, 0);
          bitmap.close();
          drawnSeq = seq;
          drawnLast = Date.now();
          drawnAt.push(drawnLast);
          if (recount()) acknowledge(seq, true);
        } else if (answer.status !== 204) {
          wait = RETRY_MS;
        }
      } catch (error) {
        wait = RETRY_MS;
      }
      if (wait) await new Promise(done => setTimeout(done, wait));
    }
  }

  // In a few words, beside the button: why this page does not tell the robot
  // "live". '' when it does. old: the picture on the page is an old one.
  function whyNot(old) {
    if (failed) return 'viewer not reached: see below';
    if (REMOTE || replaced) return 'watch only: see below';
    if (other) return 'viewer restarted: see below';
    if (!available) return 'no live picture: see below';
    if (document.hidden) return 'tab hidden';
    if (!shown) return 'Map picture showing';
    if (old) return 'no new picture: see below';
    if (!counted) return 'scroll the live picture into view';
    if (view && !view.attached) return 'robot not told: see below';
    if (view && !view.live) return 'robot told: no live view';
    return '';
  }

  // Before the rest of the note: why this page only watches, and what makes
  // it the live view. '' for a page whose pictures count.
  function watchOnly() {
    if (REMOTE) return WATCH_ONLY;
    if (replaced) return countingAsks ? ANOTHER_PAGE : NO_PAGE;
    if (other) return loadedFor === other ? NOT_LOADED : chosen() || document.hidden ? RESTARTED : LOADS_LATER;
    return '';
  }

  function told() {
    if (!view) return '';
    if (!view.attached) return ` The robot is not told of ${watching() ? 'a' : 'this'} live view: ${view.why}.`;
    if ((watching() || counted) && view.live && typeof view.age_s === 'number') {
      return ` The robot is told: live view, ${view.age_s.toFixed(2)} s old.`;
    }
    return ' The robot is told: no live view.';
  }

  function sync() {
    fresh();
    // Without an answer the viewer's last one stands: the picture stays.
    const show = chosen() && available && !document.hidden;
    const now = Date.now();
    if (show !== shown) {
      shown = show;
      shownAt = now;
      turn += 1;
      drawnAt = [];
      picture.style.display = show ? 'block' : 'none';
      // The page's own picture stays as the page keeps it; it is only hidden.
      photo.style.display = show ? 'none' : '';
      if (show) pictures(turn);
    }
    recount();
    drawnAt = drawnAt.filter(at => now - at <= 1000);
    // The picture on the page is an old one: the viewer gives no answer, or
    // no picture came for OLD_MS.
    const old = shown && drawnLast > 0 && (failed !== '' || now - Math.max(drawnLast, shownAt) > OLD_MS);
    const age = `${Math.round((now - drawnLast) / 1000)} s`;
    const dim = old ? '0.45' : '';
    if ((picture.style.opacity || '') !== dim) picture.style.opacity = dim;
    button.disabled = !available;
    button.classList.toggle('active', shown);
    button.textContent = !available ? 'no live picture' : shown ? 'Map picture' : 'Live picture';
    reason.textContent = whyNot(old);
    const first = watchOnly();
    note.textContent = (first ? `${first}. ` : '') + (
      failed ? `${failed}; trying again every second${old ? `; this picture is ${age} old` : ''}`
      : !available ? why
      : !shown ? `The stored picture of the obstacle map. Live picture shows the camera as it is now.${told()}`
      : old ? `no new picture from the viewer; this picture is ${age} old`
      : `Live camera picture, ${drawnAt.length} a second on this screen. Shown, not stored: no mask and no markers.${told()}`);
    // In the warning colour whenever the picture is not live or does not count.
    note.style.color = first || failed || !available || old ? WARN : '';
  }

  // Ask the viewer about its live picture, about itself and about this page.
  async function ask() {
    let state = null, problem = '';
    try {
      const answer = await fetch(STATE, {cache: 'no-store', signal: limit(),
        headers: REMOTE ? {} : {'X-View-Token': TOKEN}});
      if (answer.ok) state = await answer.json();
      else problem = `the viewer answered ${answer.status}`;
    } catch (error) {
      problem = UNREACHED;
    }
    failed = state ? '' : problem || UNREACHED;
    if (state) {
      heardAt = Date.now();
      const instance = typeof state.instance === 'string' && state.instance ? state.instance : INSTANCE;
      other = instance === INSTANCE ? '' : instance;
      const counting = state.counting_page || {};
      vacantFor = other && counting.loaded === false ? other : '';
      // Another page counts: so says the viewer that served this page, or a
      // later instance, one of whose pages has a view token.
      const taken = other ? !vacantFor && loadedFor !== other : counting.is_this_page === false;
      if (taken && !REMOTE && !loading) replaced = true;
      countingAsks = counting.asks === true;
      available = state.available === true;
      why = state.reason || 'the viewer has no live picture';
      view = state.view || null;
    }
    sync();
  }

  button.addEventListener('click', () => {
    if (shown) {
      wanted = false;
    } else {
      wanted = true;
      // From a replay or an older run: back to following the newest run.
      if (!follow || playing || (runs && runs.value !== 'latest')) followLive.click();
    }
    sync();
  });
  followLive.addEventListener('click', () => { wanted = true; });
  // The page's own handlers switch "follow" and "playing": look after each.
  for (const kind of ['click', 'input', 'change']) {
    document.addEventListener(kind, () => setTimeout(sync, 0), true);
  }
  // A tab that shows again asks at once: its timers ran slowly while hidden.
  document.addEventListener('visibilitychange', () => { sync(); if (!document.hidden) ask(); });
  if (observer) {
    observer.observe(picture);
  } else {
    // A scroll of any element moves the picture; it reaches the window first.
    window.addEventListener('scroll', sync, true);
    window.addEventListener('resize', sync);
  }
  setInterval(sync, 250);
  setInterval(ask, 1000);
  sync();
  ask();
})();

// The live arm.
(function () {
  // The page's own 3D scene, its text under it, its state, its two switches
  // and its draw(). Without one of them this part does nothing.
  const scene = document.getElementById('scene');
  const own = document.getElementById('status');
  let known = false;
  try {
    known = typeof follow === 'boolean' && typeof playing === 'boolean'
      && typeof draw === 'function' && typeof data === 'object';
  } catch (error) { known = false; }
  if (!known || !scene || !scene.parentNode || !own || typeof MutationObserver !== 'function') return;

  const ROBOT = '/api/live/robot.json';
  // A request that failed is made again after RETRY_MS; one that brought no
  // other state, not sooner than SAME_MS after it was made.
  const RETRY_MS = 1000, SAME_MS = 250;
  // Without an answer for this long the live arm is drawn no longer.
  const SILENT_MS = 3000;
  // Without a frame of the browser for this long, a draw's time is its own only.
  const FRAME_MS = 250;
  // From this many states missed in a second on, the line names them.
  const MISSED = 3;
  const WARN = '#ffbd69';
  const clockMs = typeof performance === 'object' && performance && typeof performance.now === 'function'
    ? () => performance.now() : () => Date.now();
  const seconds = age => `${age.toFixed(age < 10 ? 1 : 0)} s`;
  const runs = document.getElementById('run');
  const box = document.createElement('div');
  const line = document.createElement('div');
  const readings = document.createElement('div');
  box.id = 'liveArm';
  box.style.padding = '8px 14px 0';
  box.style.fontSize = '13px';
  box.style.fontVariantNumeric = 'tabular-nums';
  line.id = 'liveArmLine';
  readings.id = 'liveArmReadings';
  readings.className = 'muted';
  box.append(line, readings);
  // Under the 3D scene.
  const place = scene.parentNode;
  if (place.parentNode) place.parentNode.insertBefore(box, place.nextSibling);
  else place.append(box);

  // wanted: the page follows the newest run, in a visible tab. arm: the
  // viewer's newest answer while its arm is drawn: the live one, or the pose
  // the joints were last read at. why: why none is drawn.
  let wanted = false, turn = 0, arm = null, why = 'asking the viewer';
  // kept: the recorded arm of the page's state that holds the viewer's one.
  // clock: the viewer's wall clock at its newest answer. heardAt: when that came.
  // drawnAt, missedAt: when the last second's live states were drawn or skipped.
  let kept = null, clock = null, heardAt = 0, drawnAt = [], missedAt = [];
  // cost: what the last draw of the arm took, in ms, with the browser's frame
  // behind it. rest: ends once as long has passed again; null: nothing to wait for.
  let cost = 0, rest = null;

  // Draw the viewer's arm with the page's own draw(): in the page's state, or,
  // without a recorded run, in a state that lasts for this one draw.
  function put() {
    if (data) {
      if (!kept || kept.of !== data) kept = {of: data, robot: data.robot};
      data.robot = arm.robot;
      draw();
    } else {
      data = {map: null, failure: null, robot: arm.robot};
      try { draw(); } finally { data = null; }
    }
  }

  // Draw the arm and time it: the page's draw(), which draws every cell of
  // the map, and the browser's frame after it. The next state is asked for
  // only when as long has passed again: drawing the arm takes at most about
  // half of the page's time, however large the map is, and the rest is the
  // live picture's.
  function paint() {
    const began = clockMs();
    put();
    const took = clockMs() - began;
    if (typeof requestAnimationFrame !== 'function') {
      cost = took;
      if (took > 0) rest = new Promise(done => setTimeout(done, took));
      return;
    }
    rest = new Promise(done => {
      let over = false;
      const end = frame => {
        if (over) return;
        over = true;
        cost = took + frame;
        setTimeout(done, cost);
      };
      // A timer set in a frame's callback comes after that frame is painted.
      requestAnimationFrame(() => {
        const at = clockMs();
        setTimeout(() => end(clockMs() - at), 0);
      });
      setTimeout(() => end(0), FRAME_MS);
    });
  }

  // The page's own arm again, as its state had it.
  function back() {
    if (data && kept && kept.of === data) data.robot = kept.robot;
    kept = null;
    draw();
  }

  // How old the obstacle map on the page is now: its age in the page's state,
  // which is as old as the recording's last event, and the time since that event.
  function mapAge() {
    if (!data) return 'no recording';
    const map = data.map;
    if (!map || typeof map.age_s !== 'number') return 'none recorded';
    let age = map.age_s;
    const end = Date.parse(data.recording_start_utc) / 1000 + data.duration;
    if (clock && Number.isFinite(end)) age += Math.max(0, clock.wall + (Date.now() - clock.at) / 1000 - end);
    return `${seconds(age)} old`;
  }

  // The jaw opening; with its age when the reading is old: none is taken
  // during a move or with the motors off.
  function jawsRead(jaws) {
    if (!jaws.valid || typeof jaws.opening !== 'number') return 'jaws no reading';
    const open = `${Math.round(jaws.opening * 100)} % open`;
    if (jaws.fresh !== false) return `jaws ${open}`;
    return typeof jaws.age_s === 'number' ? `jaws: last read ${seconds(jaws.age_s)} ago (${open})`
      : `jaws: last read at an unknown time (${open})`;
  }

  function reads(told) {
    const joints = (told.joints || []).map(one => (one.valid && typeof one.deg === 'number' ? one.deg.toFixed(1) : '?'));
    const stop = told.stop_level && told.stop_level !== 'none' ? ` · STOP: ${told.stop_level}` : '';
    return `joints ${joints.join(' ')} deg · ${jawsRead(told.gripper || {})} · owner ${told.owner} · ${told.motion} · torque ${told.torque}${stop}`;
  }

  // How many live states a second are drawn, and of how many when states are
  // skipped for the time a draw takes.
  function rate() {
    const drawn = drawnAt.length, missed = missedAt.length;
    if (missed < MISSED) return `${drawn} a second`;
    return `${drawn} of ${drawn + missed} a second${cost >= 1 ? ` (a draw takes ${Math.round(cost)} ms)` : ''}`;
  }

  // The run whose arm model draws the arm, when it is not the run on the page.
  function model() {
    const run = arm.model_run;
    return run && !(data && data.run === run) ? `; arm model of run ${run}` : '';
  }

  // The line under the scene. The arm is live while its joints' readings are
  // within the viewer's limit, counted on from the viewer's newest answer.
  function say() {
    const now = Date.now();
    drawnAt = drawnAt.filter(at => now - at < 1000);
    missedAt = missedAt.filter(at => now - at < 1000);
    let text, warn = true;
    if (!wanted) {
      text = data && data.robot ? 'arm: recorded' : 'arm: none recorded';
      warn = false;
    } else if (!arm) {
      text = `arm: no live state: ${why}`;
    } else {
      const old = arm.last_read;
      const limit = typeof arm.stale_s === 'number' ? arm.stale_s : 1;
      const read = old ? old.age_s : typeof arm.pose_age_s === 'number' ? arm.pose_age_s : 0;
      const age = read + (now - heardAt) / 1000;
      if (!old && !(age > limit)) {
        text = `arm: live, ${rate()}`;
        warn = false;
      } else {
        text = `arm: last read ${seconds(age)} ago (${old ? old.why : 'the viewer sends no newer state'})`;
      }
      text += `; map: ${mapAge()}${model()}`;
    }
    line.textContent = text;
    line.style.color = warn ? WARN : '';
  }

  // No state of the viewer's to draw: the page is its own again.
  function lose(reason) {
    why = reason;
    readings.textContent = '';
    if (arm) {
      arm = null;
      back();
    }
    say();
  }

  const samePose = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((q, at) => q === b[at]);

  // The viewer's answer: a state with its arm is drawn when it is another
  // one. The arm is the live one, or, when the joints' readings are old, the
  // pose they were last read at.
  function take(told) {
    heardAt = Date.now();
    if (typeof told.wall_s === 'number') clock = {wall: told.wall_s, at: heardAt};
    const pose = told.available === true || told.last_read ? told.robot : null;
    if (!pose || !Array.isArray(pose.joints) || !Array.isArray(pose.boxes)) {
      lose(told.why || 'the viewer has no live state');
      return;
    }
    const before = arm;
    const another = !before || before.n !== told.n;
    arm = told;
    if (another && told.available === true) {
      drawnAt.push(heardAt);
      // The states between the one drawn before and this one were skipped.
      const from = before && before.available === true ? Math.max(before.n + 1, told.n - 100) : told.n;
      for (let n = from; n < told.n; n++) missedAt.push(heardAt);
    }
    // Readings that stand still are one pose: it is drawn once.
    const still = before && !told.available && !before.available && samePose(before.robot.q, pose.q);
    if (another && !still) paint();
    readings.textContent = reads(told);
    say();
  }

  // Ask for state after state while the page follows the newest run. The
  // viewer answers once it has another state than the one named: a page that
  // draws slowly gets the newest and misses the ones between.
  async function states(mine) {
    let after = null;
    while (wanted && mine === turn) {
      // Not before the last draw's time has passed once more.
      while (rest) {
        const one = rest;
        await one;
        if (rest === one) rest = null;
      }
      if (!wanted || mine !== turn) return;
      let wait = 0;
      const asked = Date.now();
      try {
        const answer = await fetch(after === null ? ROBOT : `${ROBOT}?after=${after}`, {cache: 'no-store'});
        if (!answer.ok) throw Error(`the viewer answered ${answer.status}`);
        const told = await answer.json();
        if (!told || typeof told.n !== 'number') throw Error('it has no live arm');
        look();
        if (!wanted || mine !== turn) return;
        // The same state again: the viewer waited for another one, or it says
        // what has changed about this one. Asked again at once only if it waited.
        if (told.n === after) wait = Math.max(0, SAME_MS - (Date.now() - asked));
        after = told.n;
        take(told);
      } catch (error) {
        if (!wanted || mine !== turn) return;
        lose(`no answer from the viewer: ${error.message || error}`);
        wait = RETRY_MS;
      }
      if (wait) await new Promise(done => setTimeout(done, wait));
    }
  }

  // The page's switches: the live arm is drawn only while it follows the
  // newest run. A replay and an older run are the page's own.
  function look() {
    const newest = !runs || runs.value === 'latest';
    const want = follow && !playing && newest && !document.hidden;
    if (want === wanted) return;
    wanted = want;
    turn += 1;
    drawnAt = [];
    missedAt = [];
    readings.textContent = '';
    if (want) {
      why = 'asking the viewer';
      states(turn);
    } else if (arm) {
      arm = null;
      back();
    }
    say();
  }

  function sync() {
    look();
    if (arm && Date.now() - heardAt > SILENT_MS) lose('the viewer does not answer');
    else say();
  }

  // The page's own render() wrote its text and drew its recorded arm: the
  // viewer's one is drawn over it before the browser paints.
  new MutationObserver(() => {
    look();
    if (arm) paint();
  }).observe(own, {childList: true, characterData: true, subtree: true});
  // Without a recorded run the page's own draw() has no arm: after each of
  // the page's own draws the viewer's one is drawn again.
  const again = () => { if (arm && !data) paint(); };
  // The page's own handlers switch "follow" and "playing": look after each.
  for (const kind of ['click', 'input', 'change']) {
    document.addEventListener(kind, () => { sync(); again(); });
  }
  // The page draws while its scene is dragged, zoomed or resized.
  scene.addEventListener('pointermove', event => { if (event.buttons) again(); });
  scene.addEventListener('wheel', again);
  window.addEventListener('resize', again);
  document.addEventListener('visibilitychange', sync);
  setInterval(sync, 250);
  sync();
})();
</script>
