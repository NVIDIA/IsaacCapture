# The agent program's settings for the rig: configs/agent.yaml with the rig's
# values, to go with configs/robot_app_rebot.yaml on the Thor. Every number here
# is a first value; none was measured on a robot: measure them in the hardware
# session. Angles are in rad, speeds in rad/s, times in s. A relative path is
# taken from this file's folder. The paths name ${AGENTIC_REMOTE_EXPERIMENT_DIR}
# (the workstation's copy of the experiment folder), ${AGENTIC_REMOTE_CAMERA_PR}
# (the camera_streamer example of the camera pull request) and
# ${AGENTIC_REMOTE_ENV_DIR} (the workstation's APAI Python environment); the
# program refuses any other variable and one that is not set.
#
# The program refuses a key it does not know, a key given twice, a block that is
# not a mapping, and a number above the bound its comment names ("at most").
# Every number must be above 0 (camera.max_skew_ms may be 0).

# Run folders (runs/<time>) and APAI's stores (apai/) go here, never into APAI's
# checkout or the experiment folder.
state_dir: ../.state

# debug, info, warning or error.
log_level: info

link:
  # The robot link service's local socket. Empty: the service's default path.
  socket_path: ""
  connect_timeout_s: 10.0  # at most 120 s
  # The oldest ROBOT_STATE the arm adapter reads a pose from. At most 2 s.
  state_max_age_s: 0.5
  # No PERMIT is sent on a ROBOT_STATE older than this (two state periods). At
  # most state_max_age_s.
  state_renew_age_s: 0.1
  # The profile id the robot app must name in WELCOME: profile_id of
  # configs/robot_app_rebot.yaml.
  expected_profile_id: rebot-b601-rs-thor
  # Empty: the name is made from the hashes of camera.calibration_dir/manifest.json
  # and camera.hand_eye_json. The robot app must name the same one
  # (camera_calibration_id of configs/robot_app_rebot.yaml).
  calibration_id: ""
  # The rig's robot app always names its camera calibration.
  allow_unnamed_calibration: false

# Copies of the Thor's settings, equal to configs/robot_app_rebot.yaml.
thor:
  first_wait_s: 0.5  # permits.first_wait_s; at most 5 s
  settle_timeout_s: 2.0  # executor.settle_timeout_s; at most 30 s
  # limits.agent.max_joint_speed; at most 3 rad/s. The owner's value of
  # 2026-11-16: 0.2. The agent plans at the lowest of three speeds: the one the
  # experiment's launcher takes (--speed-profile: reference, the default, is
  # overrides.safety.max_joint_vel of the experiment's
  # configs/rebot_workstation.yaml; conservative is 0.1), this key, and the
  # Thor's own agent speed limit as the robot app's WELCOME names it (a robot
  # app that names none: this key stands for it). The program says the speed
  # and where it came from in one line at its start. The start tolerance a MOVE
  # quotes follows from it (move.start_tol_rad).
  agent_max_joint_speed: 0.2

move:
  # A MOVE quotes the smaller of this and half a period's travel at the Thor's
  # agent speed limit. At most 0.2 rad.
  start_tol_rad: 0.02
  # Longest wait for joint readings taken after the call began. At most 5 s.
  fresh_wait_s: 0.6
  # The oldest obstacle grid a move starts on (at most 5 s) and the longest wait
  # for such a grid (at most 30 s). Read by the minimal stack only: the full
  # stack takes both from the experiment's route check, a third of
  # occupancy.max_age_s and thor_motion.route_preflight_s of its
  # configs/thor_runtime.yaml.
  start_grid_age_s: 1.0
  start_grid_wait_s: 3.0
  expires_in_s: 2.0  # how long a MOVE stays valid on the Thor; at most 10 s
  cancel_wait_s: 2.0  # longest wait for the RESULT after a cancel; at most 30 s

permits:
  # How many setpoints a PERMIT reaches beyond the last one sent. At most 1000.
  reach_setpoints: 25
  # Pause between two passes of the permit loop. Below life_s; at most 1 s.
  renew_s: 0.05
  life_s: 1.0  # how long a PERMIT lasts on the Thor; at most 5 s

jaws:
  fresh_s: 1.0  # an older jaw reading counts as unknown; at most 5 s
  result_timeout_s: 12.0  # at most 120 s

task:
  # false: the timed return moves the arm by itself, and its bench tests on this
  # arm come first. configs/robot_app_rebot.yaml has rest.auto_return false too.
  timed_return: false
  # Read by no program (at most 100): no count of failed steps ends a task, as
  # in the experiment's launcher; APAI ends a task at --max-steps.
  failed_steps_limit: 3
  # The minimal stack's joint speed cap for a task; at most
  # thor.agent_max_joint_speed. The full stack does not read it: its speed is
  # described at that key.
  max_joint_speed: 0.1
  # Longest wait for the RESULT of the task's own owner request. At most 60 s.
  end_wait_s: 5.0
  # Longest wait for the ROBOT_STATE that shows the agent as owner, and, before a
  # task takes the arm, for the grant of an earlier request that was not answered
  # in time. At most 30 s.
  owner_wait_s: 2.0
  grid_wait_s: 20.0  # longest wait for a usable obstacle grid at the start; at most 300 s
  # A skill stop (APAI's own stop of the arm after a motion failed) latches the
  # workstation checker. true: the next task clears that latch at its first
  # motion skill, after the typed yes and the Thor's grant; its question says so.
  clear_skill_stop: true

camera:
  # The interpreter of the camera consumer (it has CuPy); the camera frame bridge
  # runs under it.
  bridge_python: ${AGENTIC_REMOTE_CAMERA_PR}/cuda_ipc_consumer/.venv/bin/python
  # Empty: the environment variable AGENTIC_REMOTE_CAMERA_PR.
  camera_pr: ""
  # ipc.socket_path of camera_receiver_rebot.yaml.
  receiver_socket: /tmp/camera_receiver_avs1_cuda_ipc.sock
  streams: [head.left, head.right]  # two different names
  # The workstation's copy of the stereo calibration folder and of the hand-eye
  # file in use on the Thor: the fit of 2026-11-17 (20261118T015157Z-live-1rrfshus);
  # summary.json beside it says accepted_fit true.
  # The robot app must name the same file (stereo-c50bf5b2b899+mount-6ba1cda8fdc3).
  calibration_dir: ${AGENTIC_REMOTE_EXPERIMENT_DIR}/.state/thor/calibration
  hand_eye_json: ${AGENTIC_REMOTE_EXPERIMENT_DIR}/.state/thor/mounting/20261118T015157Z-live-1rrfshus/handeye.json
  # The two eyes of a stereo pair lie at most this far apart. At most 50 ms.
  max_skew_ms: 5.0
  depth_backend: ffs
  fps: 7.0  # at most 120
  # The rig's permits rest on capture times of real camera frames only. The
  # program also ends when a camera with invented times meets the real driver.
  allow_invented_times: false

experiment:
  # The real arm needs the full stack: the experiment's behaviour hooks, its
  # obstacle grid bridge on cuda:0 and its cloud model. The program ends when the
  # minimal stack meets the real driver.
  stack: full
  arm_profile: mock  # read by the minimal stack only
  llm: mock  # read by the minimal stack only
  # The model client's program (the Codex command-line program), installed in
  # the workstation's APAI Python environment. It is not installed by this
  # example: installing it and its login wait for the owner.
  codex_bin: ${AGENTIC_REMOTE_ENV_DIR}/codex/node_modules/.bin/codex
  # The rig runs on the experiment's grid bridge; clear is refused with the full stack.
  grid: bridge
  # Two recordings of the experiment, on as in its own launcher. timing: how long
  # each step of a task took (timing.jsonl in the run folder; timing-report.txt and
  # timeline.html when the program ends); --no-timing switches it off for one run,
  # and --record-debug needs it. model_trace: every request to the model and its
  # answer, with the pictures sent (model-trace/ in the run folder). Neither has
  # run on the workstation against the real arm yet; false switches one off.
  timing: true
  model_trace: true

# The arm profile is the one the experiment's launcher loads: the arm_profile of
# the experiment's configs/thor_runtime.yaml (configs/thor_operation.yaml: home
# pose, park pose, the arm mask's margin, the motion bounds) over the arm file of
# its .state folder (the arm's name), without the motor bus. A block
#   rig:
#     home_q, park_q: one value per joint
#     body_mask_dilate_px: at most 100
#     motion_bounds: joint_center_rad, max_joint_deviation_rad, tcp_center_m and
#       max_tcp_distance_m, these four keys and no other
# puts a value in the place of the experiment's. This file names none.
