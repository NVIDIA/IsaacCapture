# The live view's settings: a camera picture and the robot's status for a browser
# on the workstation, and VIEW_STATUS for the Thor. Every number here is a first
# value; none was measured on a robot. Times are in s. A relative path is taken
# from this file's folder; a path may name an environment variable as ${NAME}.
#
# The program refuses a key it does not know and a number outside the bound its
# comment names.

# The robot link service's local socket. Empty: the service's default path.
socket_path: ""

# debug, info, warning or error.
log_level: info

# The log of the view's camera frame bridge goes into <state_dir>/view.
state_dir: ../.state

http:
  # The page is for a browser on this machine: any other address is refused.
  address: 127.0.0.1
  port: 47620  # 0 lets the system pick one; the program prints the address

# The same names and meanings as in agent.yaml. The view starts a camera frame
# bridge of its own: a second reader of the camera receiver, no second decoder.
camera:
  # The interpreter of the camera consumer (it has CuPy):
  # <camera pull request>/cuda_ipc_consumer/.venv/bin/python. Needed for
  # --source link.
  bridge_python: ""
  # The camera_streamer example of the camera pull request. Empty: the
  # environment variable AGENTIC_REMOTE_CAMERA_PR.
  camera_pr: ""
  # ipc.socket_path of camera_receiver_rebot.yaml.
  receiver_socket: /tmp/camera_receiver_avs1_cuda_ipc.sock
  streams: [head.left, head.right]  # two different names; the left eye is shown
  max_skew_ms: 5.0  # 0 to 50

# The camera picture: the left eye, made small and packed as JPEG.
picture:
  width_px: 960  # 64 to 4096; a narrower camera frame is not made wider
  fps: 5.0  # stereo pairs asked for per second; at most 15
  jpeg_quality: 80  # 1 to 100

status:
  period_s: 0.2  # one VIEW_STATUS this often, also while not live; at most 1 s
  # The view is live only while the page acknowledged a picture, with its tab
  # visible, less than this long ago. At most 10 s.
  ack_timeout_s: 1.0
  # The view is live only on a ROBOT_STATE younger than this: it gives the
  # Thor's wall clock, which the picture's age is measured on. At most 10 s.
  state_max_age_s: 1.0
