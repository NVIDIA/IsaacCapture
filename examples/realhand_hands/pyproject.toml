[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaaccapture-examples-realhand-hands"
version = "0.0.0"
description = "RealHand L6, O6, and L20 configurations for official hand retargeting"
requires-python = ">=3.11,<3.14"
dependencies = ["isaaccapture[cloudxr,retargeters]", "pyyaml>=6.0.3"]

[tool.hatch.build]
only-include = ["python/isaaccapture_examples/realhand_hands"]

[tool.hatch.build.targets.wheel]
sources = ["python"]
