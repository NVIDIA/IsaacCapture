; The capture scripts are run by path, not installed, so `from session import STEPS`
; resolves through this directory. pytest has to put it on sys.path the same way.
;
; Run these with the *checker's* venv, which is where pytest lives:
;
;   cd src/python/isaaccapture/cts/full_body/capture && ../checker/.venv/bin/python -m pytest
;
; That venv has no isaaccapture in it, which is the point: the state machine under test
; imports neither it nor viser, so the tests run on a machine with nothing built.
[pytest]
pythonpath = .
testpaths = tests
