#
# Example session-reference snippet for the io_exo_glove_ros2 plugin, r35. Measured from the
# operator's current mounting:
#   chord/offset/gap = the r34 reference (straight 102204 + fist 095821, same mounting);
#   angle            = the per-joint relaxed straight pose over live_20261112_102204 and 103640;
#   deadband         = left 25.000 / right 19.700 model deg (measured relaxed-vs-stiff offset + 2,
#                      capped at 25).
# Replace them with your own by running the plugin once with --export-session-reference=PATH and
# pasting what it writes.
#
# Two equally good ways to use this file:
#   1. copy the two keys below into config/io_exo_glove_ros2.yaml (the plugin's config), or
#   2. point the plugin at this file for one run:
#        ./io_exo_glove_ros2_plugin --session-reference=config/io_exo_glove_ros2_session_reference.example.yaml
#
# Format (README.md, "Session reference"):
#   reference_<left|right>: "chord <digit>=<mm>; offset <digit>=<x,y,z,w>; gap <finger>=<open>/<tightest>;
#                            angle <digit><slot>=<degrees>; deadband <model degrees>"
# Digits: thumb, index, middle, ring, little; slots 0..3 (0 = spread/mount, 1..3 = MCP/PIP/DIP,
# thumb CMC/MCP/IP). mm/degrees with three decimals, unit quaternion with six. A five-section block
# drives the four fingers from the angles with the open deadband; a four-section r31 block still
# loads and runs the r31 map (deadband 0) with a warning; a three-section r30 block runs the chord
# driver. A hand with a complete block is mapped from its first frame and never runs the capture
# window.
