name: io_exo_glove_ros2
description: "Exoskeleton glove hands (OpenXR hand tracker), joint angles (JointStateOutput) and fingertip poses (JointSe3PoseOutput)"
command: "./io_exo_glove_ros2_plugin"
version: "1.0.0"
devices:
  - path: "/hand/left"
    type: "hand_tracker"
    description: "Left exoskeleton hand, injected as the OpenXR hand skeleton the conformance suite records (ROS 2 tf2_msgs/TFMessage; topic set in config/io_exo_glove_ros2.yaml)"
  - path: "/hand/right"
    type: "hand_tracker"
    description: "Right exoskeleton hand, injected as the OpenXR hand skeleton (ROS 2 tf2_msgs/TFMessage; topic set in config/io_exo_glove_ros2.yaml)"
  - path: "/glove/exo_joints_left"
    type: "joint_state"
    description: "Left hand's exoskeleton joint angles, split by joint name from the glove's 42-joint message (ROS 2 sensor_msgs/JointState; collection set in config/io_exo_glove_ros2.yaml)"
  - path: "/glove/exo_joints_right"
    type: "joint_state"
    description: "Right hand's exoskeleton joint angles, in their own collection so a glove that drops out is visible (ROS 2 sensor_msgs/JointState; collection set in config/io_exo_glove_ros2.yaml)"
  - path: "/glove/exo_tips_left"
    type: "joint_se3_pose"
    description: "Left hand fingertip poses in base_link, keyed HAND_RAW_*_TIP (ROS 2 tf2_msgs/TFMessage; topic set in config/io_exo_glove_ros2.yaml)"
  - path: "/glove/exo_tips_right"
    type: "joint_se3_pose"
    description: "Right hand fingertip poses in base_link, keyed HAND_RAW_*_TIP (ROS 2 tf2_msgs/TFMessage; topic set in config/io_exo_glove_ros2.yaml)"
