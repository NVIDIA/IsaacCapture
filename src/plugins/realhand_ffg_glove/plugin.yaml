name: realhand_ffg_glove_plugin
description: "RealHand FFG Glove OpenXR hand tracking"
command: "./realhand_ffg_glove_plugin"
version: "1.0.0"
devices:
  - path: "/hand/left"
    type: "hand_tracker"
    description: "Left RealHand FFG Glove human skeleton (26 OpenXR joints)"
  - path: "/hand/right"
    type: "hand_tracker"
    description: "Right RealHand FFG Glove human skeleton (26 OpenXR joints)"
  - path: "/glove/realhand_ffg_glove_left"
    type: "joint_state"
    description: "Left RealHand FFG Glove raw sensors for calibration and diagnostics"
  - path: "/glove/realhand_ffg_glove_right"
    type: "joint_state"
    description: "Right RealHand FFG Glove raw sensors for calibration and diagnostics"
