[[tracker]]
name = "joint_state"
table = "JointStateOutput"
max_flatbuffer_size = 4096

[[tracker]]
name = "joint_se3_pose"
table = "JointSe3PoseOutput"
# 5 raw tips are ~300 B; sized so a 26-joint OpenXR hand (~900 B) also fits, because the
# tensor collection size is fixed at creation and raising it later breaks paired producers.
max_flatbuffer_size = 1024

[[tracker]]
name = "plugin_device_status"
table = "PluginDeviceStatusSnapshot"
class = "PluginDeviceStatusTracker"
max_flatbuffer_size = 4096
facade_tensor_constant = true
python_accessor = "get_device_status_snapshot"

[[tracker]]
name = "se3_tracker"
table = "Se3TrackerPose"
class = "Se3Tracker"
max_flatbuffer_size = 256
facade_tensor_constant = true

[[tracker]]
name = "oglo_tactile"
table = "OgloGloveSample"
channel = "oglo"
python_accessor = "get_glove_data"

[[tracker]]
name = "generic_3axis_pedal"
table = "Generic3AxisPedalOutput"
schema = "pedals"
channel = "pedals"
traits = "PedalRecordingTraits"
max_flatbuffer_size = 256
python_accessor = "get_pedal_data"

[[tracker]]
name = "haptic_command"
direction = "push"
table = "HapticCommand"
schema = "haptic_command"
tensor_identifier = "haptic_command"
max_flatbuffer_size = 256

[[tracker]]
name = "frame_metadata_oak"
table = "FrameMetadataOak"
class = "FrameMetadataTrackerOak"
schema = "oak"
tensor_identifier = "frame_metadata"
channel = "oak"
header = "frame_metadata_tracker_oak"
max_flatbuffer_size = 128

[[tracker]]
name = "ego_audio"
table = "EgoAudioChunk"
tensor_identifier = "audio_chunk"
max_flatbuffer_size = 32768
mcap_channels = ["Audio", "Audio_tracked"]
replay_channels = ["Audio"]

[[tracker]]
name = "ego_calibration"
table = "EgoCalibration"
tensor_identifier = "calibration"
max_flatbuffer_size = 32768
mcap_channels = ["Calibration", "Calibration_tracked"]
replay_channels = ["Calibration"]

[[tracker]]
name = "ego_device_state"
table = "EgoDeviceState"
tensor_identifier = "device_state"
max_flatbuffer_size = 32768
mcap_channels = ["DeviceState", "DeviceState_tracked"]
replay_channels = ["DeviceState"]

[[tracker]]
name = "steering_wheel"
table = "SteeringWheelOutput"
max_flatbuffer_size = 1024
python_accessor = "get_wheel_data"
